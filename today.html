<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کارهای امروز — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { accounts, activities, TASK_TYPES, CONFIG: C } = DB;
const me = UI.me();
const repOf = () => me.role === 'rep' ? me.rep : (UI.param('rep') || UI.store.get('todayRep', 'r1'));
let tab = UI.param('tab') || 'today';
let focus = -1;

// open state for a task, honouring what the rep did in this browser
function stateOf(t) {
  const s = UI.taskState(t.id);
  if (!s || !s.status || s.status === 'open') return { bucket: t.due <= 0 ? 'today' : 'week', due: t.due };
  if (s.status === 'done') return { bucket: 'done', due: t.due, s };
  if (s.status === 'snoozed') return { bucket: 'week', due: Math.max(t.due, s.snoozeDays || 1), s };
  return { bucket: t.due <= 0 ? 'today' : 'week', due: t.due, s };
}
const ICON = { card: 'card', repeat: 'repeat', down: 'down', up: 'up', users: 'users', star: 'star', phone: 'phone', sparkle: 'sparkle' };
const typeOf = t => TASK_TYPES[t.type] || { label: 'پیشنهاد هوشمند', icon: 'sparkle', prio: 2 };

UI.page({
  id: 'today', title: 'کارهای امروز', sources: ['main', 'wallet'], noBanner: true,
  sub: UI.WEEKDAYS[DB.dayDate(0).getUTCDay()] + ' ' + UI.date(0, { year: true }) + ' — فهرست را از بالا شروع کنید؛ ترتیب بر اساس فوریت و ارزش است',
  actions: () => (me.role !== 'rep' ? '<div class="seg" id="reps" role="group" aria-label="کارشناس">' + C.reps.map(r => '<button data-rep="' + r.id + '" class="' + (r.id === repOf() ? 'on' : '') + '">' + UI.esc(r.short) + '</button>').join('') + '</div>' : '') +
    '<button class="btn sm ghost" id="kb" title="میان‌برهای صفحه‌کلید">' + UI.icon('info') + 'میان‌برها</button>',
  render(ctx) {
    const rep = DB.rep(repOf());
    // tasks sent here from the AI brief (stored in this browser) join the rule-based list
    const aiTasks = Object.entries(UI.store.get('tasks', {})).filter(([id, s]) => id.startsWith('ai:today:') && s.status && s.accountId && s.owner === rep.id)
      .map(([id, s]) => ({ id, type: 'ai', accountId: s.accountId, due: 0, value: s.value || 0, why: 'پیشنهاد تحلیل هوشمند · ' + (s.why || '') }));
    const all = DB.tasksFor(rep.id).concat(aiTasks).map(t => Object.assign(t, stateOf(t)));
    const lists = { today: all.filter(t => t.bucket === 'today'), week: all.filter(t => t.bucket === 'week').sort((p, q) => p.due - q.due), done: all.filter(t => t.bucket === 'done') };
    const todayTotal = all.filter(t => t.due <= 0 || (t.s && t.s.status === 'done' && t.due <= 0)).length;
    const doneToday = lists.done.length;
    const calls = activities.filter(x => x.rep === rep.id && x.t === 0 && (x.type === 'call' || x.type === 'meeting')).length;
    const localCalls = accounts.reduce((n, a) => n + UI.notes(a.id).filter(x => x.kind === 'call' && Date.now() - x.at < 864e5).length, 0);
    const book = accounts.filter(a => UI.ownerOf(a) === rep.id && a.paying);
    const renew14 = book.filter(a => a.renewIn <= 14);
    const valueToday = lists.today.reduce((s, t) => s + (t.value || 0), 0);
    const spilled = all.filter(t => t.spilled).length;

    let h = '<div class="kpis">' +
      UI.kpi({ label: 'کار باز برای امروز', value: UI.n(lists.today.length), cmp: UI.n(doneToday) + ' انجام شده' + (lists.today.filter(t => t.due < 0).length ? ' · <b style="color:var(--crit-ink)">' + UI.n(lists.today.filter(t => t.due < 0).length) + ' عقب‌افتاده</b>' : '') }) +
      UI.kpi({ label: 'تماس امروز', value: UI.n(calls + localCalls), unit: 'از ' + UI.n(rep.callTarget), cmp: '<div class="progress" style="width:120px;margin-top:5px"><i style="width:' + Math.min(100, (calls + localCalls) / rep.callTarget * 100) + '%"></i></div>' }) +
      UI.kpi({ label: 'درآمد در گرو کارهای امروز', value: UI.compactParts(valueToday).num, unit: UI.compactParts(valueToday).unit + ' ' + C.currency, cmp: 'ماهانه · جمع حساب‌های فهرست امروز' }) +
      UI.kpi({ label: 'تمدید در ۱۴ روز آینده', value: UI.n(renew14.length), cmp: UI.compact(renew14.reduce((s, a) => s + a.mrr, 0)) + ' در ماه · ' + UI.n(renew14.filter(a => a.health < 60).length) + ' با سلامت پایین' }) +
      UI.kpi({ label: 'دفتر مشتریان ' + rep.short, value: UI.n(book.length), unit: 'حساب', cmp: UI.compact(book.reduce((s, a) => s + a.mrr, 0)) + ' در ماه · ' + UI.n(book.filter(a => a.health < 50).length) + ' در خطر', href: 'customers.html?view=paying&owner=' + rep.id }) +
      '</div>';

    if (me.role !== 'rep') {
      h += '<div class="card"><div class="card-h"><h2>وضعیت تیم امروز</h2><span class="hint">برای دیدن فهرست هر نفر، نامش را بالا انتخاب کنید</span></div><div class="card-b" style="padding-top:8px"><div class="grid g4">' +
        C.reps.map(r => {
          const ts = DB.tasksFor(r.id).map(t => Object.assign(t, stateOf(t)));
          const open = ts.filter(t => t.bucket === 'today').length, done = ts.filter(t => t.bucket === 'done').length;
          const c = activities.filter(x => x.rep === r.id && x.t === 0 && (x.type === 'call' || x.type === 'meeting')).length;
          return '<button class="row top" data-pick="' + r.id + '" style="gap:10px;text-align:right;padding:8px;border-radius:9px;border:1px solid ' + (r.id === rep.id ? 'color-mix(in srgb,var(--accent) 50%,transparent)' : 'var(--border)') + ';background:' + (r.id === rep.id ? 'var(--accent-wash)' : 'transparent') + '"><span class="avatar">' + UI.esc(UI.initials(r.name)) + '</span><span style="flex:1;min-width:0"><b style="display:block">' + UI.esc(r.name) + '</b><span class="muted" style="font-size:11.5px">' + UI.n(open) + ' کار باز · ' + UI.n(done) + ' انجام · ' + UI.n(c) + '/' + UI.n(r.callTarget) + ' تماس</span><div class="progress" style="margin-top:6px"><i style="width:' + Math.min(100, c / r.callTarget * 100) + '%"></i></div></span></button>';
        }).join('') + '</div></div></div>';
    }

    const tabs = [['today', 'امروز', lists.today.length], ['week', 'این هفته', lists.week.length], ['done', 'انجام‌شده', lists.done.length]];
    h += '<div class="grid g-side">' +
      '<section class="card"><div class="tabs" style="padding:0 12px" role="tablist">' + tabs.map(([k, l, n]) => '<button role="tab" data-tab="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + l + ' <span class="n">' + UI.fa(n) + '</span></button>').join('') + '</div>' +
        '<div id="list"></div>' +
        '<div class="card-f"><span>' + (spilled ? UI.fa(spilled) + ' کار کم‌ارزش‌تر به روزهای بعد منتقل شد تا فهرست امروز از ظرفیت (' + UI.fa(rep.callTarget + 2) + ' کار) بیشتر نشود' : 'فهرست از قاعده‌ها ساخته می‌شود: پرداخت ناموفق، تمدید، افت سلامت، سرنخ ارتقا، صندلی پر، مشتری جدید، قرار تماس') + '</span><span class="nowrap"><span class="kbd">j</span> <span class="kbd">k</span> حرکت · <span class="kbd">c</span> ثبت نتیجه · <span class="kbd">d</span> انجام شد</span></div></section>' +
      '<div class="stack">' +
        UI.card({ title: 'تمدیدهای پیش رو', hint: UI.fa(book.filter(a => a.renewIn <= 30).length) + ' در ۳۰ روز', flush: true,
          body: '<div class="list" style="padding:0 16px">' + book.slice().sort((p, q) => p.renewIn - q.renewIn).slice(0, 7).map(a => '<div class="li"><span class="main"><a class="t" href="' + UI.custLink(a) + '" data-acc="' + a.id + '">' + UI.esc(a.name) + '</a><span class="d">' + UI.date(-a.renewIn) + ' · ' + UI.inDays(a.renewIn) + ' · ' + UI.compact(a.mrr) + '</span></span><span class="end">' + UI.healthScore(a.health) + '</span></div>').join('') + '</div>',
          foot: '<span>همهٔ تمدیدها</span><a href="sales.html?tab=renew">میز فروش</a>' }) +
        UI.card({ title: 'فعالیت امروز ' + rep.short, flush: true, body: '<div id="acts" class="list" style="padding:0 16px"></div>' }) +
      '</div></div>';
    ctx.body.innerHTML = h;

    // --- wiring
    const reps = document.getElementById('reps');
    if (reps) reps.querySelectorAll('button').forEach(b => b.onclick = () => { UI.store.set('todayRep', b.dataset.rep); UI.setParam('rep', b.dataset.rep); focus = -1; ctx.rerender(); });
    ctx.body.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { UI.store.set('todayRep', b.dataset.pick); UI.setParam('rep', b.dataset.pick); focus = -1; ctx.rerender(); });
    ctx.body.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; UI.setParam('tab', tab === 'today' ? null : tab); focus = -1; ctx.rerender(); });

    const list = lists[tab];
    const L = ctx.body.querySelector('#list');
    if (!list.length) {
      L.innerHTML = '<div class="empty"><b>' + (tab === 'done' ? 'هنوز کاری انجام نشده' : tab === 'today' ? 'کار امروز تمام شد 🎉' : 'برای این هفته کاری نمانده') + '</b>' + (tab === 'today' ? 'سراغ «این هفته» بروید یا از «میز فروش» سرنخ تازه بردارید.' : '') + '</div>';
    } else {
      L.innerHTML = list.map((t, i) => {
        const a = DB.byId.get(t.accountId), T = typeOf(t);
        const overdue = t.bucket === 'today' && t.due < 0;
        return '<div class="task' + (t.bucket === 'done' ? ' done' : '') + (i === focus ? ' kfocus' : '') + '" data-i="' + i + '">' +
          '<span class="ico p' + T.prio + '">' + UI.icon(ICON[T.icon] || 'info') + '</span>' +
          '<div style="min-width:0"><div class="tt"><a href="' + UI.custLink(a) + '" data-acc="' + a.id + '">' + UI.esc(a.name) + '</a>' + UI.planBadge(a.plan) + '<span class="tag">' + UI.esc(T.label) + '</span>' + (overdue ? '<span class="sig due">عقب‌افتاده</span>' : '') + (t.bucket === 'week' ? '<span class="tag">' + UI.inDays(t.due) + '</span>' : '') + '</div>' +
          '<div class="why">' + UI.esc(t.why) + (t.s && t.s.outcome ? ' · <b>نتیجه: ' + UI.esc(DB.OUTCOME_LABEL[t.s.outcome] || { won: 'موفق', lost: 'از دست رفت' }[t.s.outcome] || t.s.outcome) + '</b>' : '') + '</div>' +
          '<div class="meta"><span>' + (a.mrr ? UI.money(a.mrr) + ' در ماه' : 'پلن ' + C.plans[a.plan].name) + '</span><span>سلامت ' + UI.n(a.health) + '</span><span>آخرین فعالیت: ' + UI.esc(UI.ago(a.lastSeenMin)) + '</span>' + (t.type === 'upsell' ? '<span>ارزش ارتقا: +' + UI.compact(t.value) + '</span>' : '') + '</div></div>' +
          '<div class="acts">' + (t.bucket === 'done'
            ? '<button class="btn sm ghost" data-a="undo">بازگردانی</button>'
            : '<button class="btn sm primary" data-a="call" title="ثبت نتیجهٔ تماس (c)">' + UI.icon('phone') + 'ثبت نتیجه</button><span class="rel"><button class="btn sm" data-a="snooze" title="تعویق (s = فردا)">' + UI.icon('snooze') + 'تعویق</button></span><button class="btn sm ghost icon" data-a="done" title="انجام شد (d)" aria-label="انجام شد">' + UI.icon('check') + '</button>') +
          '</div></div>';
      }).join('');
    }
    const act = (i, what) => {
      const t = list[i]; if (!t) return;
      const a = DB.byId.get(t.accountId);
      if (what === 'call') UI.logOutcome(a, t.id, () => ctx.rerender());
      else if (what === 'done') { UI.setTask(t.id, { status: 'done' }); UI.toast('«' + a.name + '» انجام شد', () => { UI.setTask(t.id, { status: t.type === 'ai' ? 'open' : null }); ctx.rerender(); }); ctx.rerender(); }
      else if (what === 'undo') { UI.setTask(t.id, { status: t.type === 'ai' ? 'open' : null }); ctx.rerender(); }
      else if (what === 'snooze1') { UI.setTask(t.id, { status: 'snoozed', snoozeDays: 1 }); UI.toast('به فردا منتقل شد', () => { UI.setTask(t.id, { status: t.type === 'ai' ? 'open' : null }); ctx.rerender(); }); ctx.rerender(); }
    };
    L.querySelectorAll('.task').forEach(row => {
      const i = +row.dataset.i;
      row.querySelectorAll('[data-a]').forEach(b => b.onclick = ev => {
        ev.stopPropagation();
        if (b.dataset.a !== 'snooze') return act(i, b.dataset.a);
        UI.popover(b, [[1, 'فردا'], [3, '۳ روز دیگر'], [7, 'هفتهٔ بعد']].map(([d, l]) => '<button class="it" data-d="' + d + '">' + l + '</button>').join(''), 150, p => p.querySelectorAll('[data-d]').forEach(x => x.onclick = () => {
          UI.setTask(list[i].id, { status: 'snoozed', snoozeDays: +x.dataset.d }); p.remove(); UI.toast('تعویق تا ' + UI.inDays(+x.dataset.d)); ctx.rerender();
        }));
      });
      row.addEventListener('click', ev => { if (ev.target.closest('a,button')) return; focus = i; UI.openAccount(list[i].accountId); });
    });
    UI.setListNav({
      move(d) { focus = Math.max(0, Math.min(list.length - 1, focus + d)); L.querySelectorAll('.task').forEach((r, k) => r.classList.toggle('kfocus', k === focus)); const r = L.querySelectorAll('.task')[focus]; if (r) r.scrollIntoView({ block: 'nearest' }); },
      open() { if (focus >= 0 && list[focus]) UI.openAccount(list[focus].accountId); },
      act(key) { if (focus < 0) return; if (key === 'c') act(focus, 'call'); else if (key === 'd') act(focus, tab === 'done' ? 'undo' : 'done'); else if (key === 's') act(focus, 'snooze1'); },
    });
    const kb = document.getElementById('kb'); if (kb) kb.onclick = () => document.dispatchEvent(new KeyboardEvent('keydown', { key: '?' }));

    // today's activity: from the log + calls logged in this browser
    const mine = activities.filter(x => x.rep === rep.id && x.t === 0).sort((p, q) => q.min - p.min);
    const local = [];
    accounts.forEach(a => UI.notes(a.id).forEach(nt => { if (Date.now() - nt.at < 864e5 && nt.who === UI.whoName()) local.push({ a, nt }); }));
    const A = ctx.body.querySelector('#acts');
    A.innerHTML = (local.map(({ a, nt }) => '<div class="li"><span class="main"><a class="t" href="' + UI.custLink(a) + '" data-acc="' + a.id + '">' + UI.esc(a.name) + '</a><span class="d">' + UI.esc(nt.text) + '</span></span><span class="end faint">همین حالا</span></div>').join('') +
      mine.slice(0, 8).map(x => { const a = DB.byId.get(x.accountId); return '<div class="li"><span class="main"><a class="t" href="' + UI.custLink(a) + '" data-acc="' + a.id + '">' + UI.esc(a.name) + '</a><span class="d">' + UI.esc(DB.OUTCOME_LABEL[x.outcome] || x.outcome) + (x.mrr ? ' · ' + UI.compact(x.mrr) : '') + '</span></span><span class="end faint">' + UI.clock(x.min) + '</span></div>'; }).join('')) ||
      '<div class="empty">امروز هنوز تماسی ثبت نشده</div>';
  },
});
})();
</script>
</body>
</html>
