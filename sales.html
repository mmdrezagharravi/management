<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>میز فروش — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { accounts, CONFIG: C } = DB;
const CUR = C.currency;
const RISK = 60;                                   // renewal is "at risk" below this health score

/* ---- helpers (page-local) */
const sum = (list, f) => list.reduce((t, a) => t + f(a), 0);
const weakest = a => C.health.components.reduce((m, c) => a.components[c.key] < a.components[m.key] ? c : m, C.health.components[0]);
const lostMrr = a => { for (let i = a.planEvents.length - 1; i >= 0; i--) if (a.planEvents[i].mrr > 0) return a.planEvents[i].mrr; return 0; };
const lostPlan = a => { for (let i = a.planEvents.length - 1; i >= 0; i--) if (a.planEvents[i].mrr > 0) return a.planEvents[i].plan; return 'basic'; };
const churnTenure = a => a.planEvents[0].t - a.churnedAt;
const dur = d => d < 60 ? UI.fa(d) + ' روز' : d < 730 ? UI.fa(Math.round(d / 30.4)) + ' ماه' : UI.n(d / 365, 1) + ' سال';
const lastInv = a => a.invoices[a.invoices.length - 1];
const acc = (a, sub) => '<div style="min-width:150px">' + UI.acctCell(a, sub == null ? {} : { sub }) + '</div>';
const ownerCell = a => { const o = UI.ownerOf(a); return o ? UI.repName(o, true) : '<span class="badge st-warn"><i class="dot"></i>بدون مسئول</span>'; };
const ownerCsv = a => { const o = UI.ownerOf(a); return o ? DB.rep(o).name : ''; };
const usageCell = a => {
  const u = a.maxUsage, r = u.ratio;
  const col = r >= 0.95 ? 'var(--critical)' : r >= 0.8 ? 'var(--warning)' : 'var(--series-1)';
  return '<div style="min-width:130px"><div class="row between" style="font-size:11.5px"><span class="muted">' + UI.esc(u.label) + '</span><b class="tnum">' + UI.pct(Math.min(r, 9.99)) + '</b></div>' +
    '<div style="height:5px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:3px"><i style="display:block;height:100%;width:' + Math.min(100, r * 100) + '%;background:' + col + '"></i></div></div>';
};

const paying = accounts.filter(a => a.paying);
const lists = {
  renew: paying.filter(a => a.renewIn <= 90),
  upsell: accounts.filter(a => a.segments.includes('upsell')),
  winback: accounts.filter(a => a.churnedAt !== undefined && a.churnedAt <= 120),
  pastdue: accounts.filter(a => a.pastDue),
  champions: accounts.filter(a => a.segments.includes('champions')),
};

/* ---- shared columns */
const col = {
  acc: { key: 'name', label: 'مشتری', render: a => acc(a), csv: a => a.name },
  plan: { key: 'plan', label: 'پلن', sort: a => C.planOrder.indexOf(a.plan) * 1e9 + a.mrr, desc: true, render: a => UI.planBadge(a.plan) + (a.paying ? '<span class="s">' + UI.esc(C.cycles[a.cycle].name) + '</span>' : ''), csv: a => C.plans[a.plan].name },
  mrr: { key: 'mrr', label: 'درآمد ماهانه', num: true, render: a => '<b>' + UI.compact(a.mrr) + '</b>', csv: a => a.mrr },
  health: { key: 'health', label: 'سلامت', num: true, render: a => UI.healthScore(a.health), csv: a => a.health },
  owner: { key: 'owner', label: 'مسئول', sort: a => UI.ownerOf(a) || 'zz', render: ownerCell, csv: ownerCsv },
};

const TABS = {
  renew: {
    label: 'تمدیدهای ۹۰ روز', sort: { key: 'renew', dir: 'asc' },
    views: [
      { key: 'all', label: 'همه', test: null },
      { key: 'risk', label: 'سلامت زیر ' + UI.fa(RISK), test: a => a.health < RISK },
      { key: 'soon', label: '۱۴ روز آینده', test: a => a.renewIn <= 14 },
    ],
    note: l => { const r = l.filter(a => a.health < RISK); return '<b>' + UI.fa(l.length) + '</b> مشتری تا ۹۰ روز دیگر تمدید می‌کنند؛ <b>' + UI.fa(r.length) + '</b> نفرشان سلامت زیر ' + UI.fa(RISK) + ' دارند (' + UI.money(sum(r, a => a.mrr)) + '). پیش از سررسید تماس بگیرید و دلیل ضعیف‌ترین مؤلفه را بپرسید.'; },
    columns: [
      col.acc, col.plan, col.mrr,
      { key: 'renew', label: 'تمدید', sort: a => a.renewIn, render: a => '<span class="nowrap">' + UI.date(-a.renewIn) + '</span><span class="s">' + UI.inDays(a.renewIn) + '</span>', csv: a => a.renewIn },
      col.health,
      { key: 'weak', label: 'ضعیف‌ترین مؤلفه', sort: a => a.components[weakest(a).key], render: a => { const w = weakest(a); return '<b>' + UI.esc(w.label) + '</b><span class="s">' + UI.fa(a.components[w.key]) + ' از ۲۰</span>'; }, csv: a => weakest(a).label },
      col.owner,
    ],
  },
  upsell: {
    label: 'فرصت ارتقا', sort: { key: 'value', dir: 'desc' },
    views: [
      { key: 'all', label: 'همه', test: null },
      { key: 'none', label: 'بدون مسئول', test: a => !UI.ownerOf(a) },
      { key: 'paying', label: 'مشتری پایه', test: a => a.paying },
    ],
    note: l => { const un = l.filter(a => !UI.ownerOf(a)); return '<b>' + UI.fa(l.length) + '</b> حساب به سقف پلن خورده‌اند و صفحهٔ قیمت را دیده‌اند — ارزش بالقوه ' + UI.money(sum(l, DB.upgradeValue)) + ' در ماه. ' + (un.length ? '<b>' + UI.fa(un.length) + '</b> سرنخ مسئول ندارند؛ انتخابشان کنید و به یک نفر بدهید.' : 'همه مسئول دارند.'); },
    columns: [
      { key: 'name', label: 'مشتری', render: a => acc(a, UI.esc(C.plans[a.plan].name) + ' · ' + UI.esc(UI.ago(a.lastSeenMin))), csv: a => a.name },
      { key: 'signal', label: 'سیگنال', sort: a => a.limitHits30 + a.pricingVisits30 * 2, desc: true, render: a => UI.signals(a), csv: a => a.limitHits30 + ' سقف / ' + a.pricingVisits30 + ' قیمت' },
      { key: 'usage', label: 'پرمصرف‌ترین سهمیه', num: true, sort: a => a.maxUsage.ratio, render: usageCell, csv: a => a.maxUsage.label + ' ' + Math.round(a.maxUsage.ratio * 100) + '%' },
      { key: 'value', label: 'درآمد بالقوه / ماه', num: true, sort: a => DB.upgradeValue(a) * 1000 + a.limitHits30, render: a => '<b>+' + UI.compact(DB.upgradeValue(a)) + '</b><span class="s">' + (a.plan === 'free' ? 'به پایه' : a.plan === 'basic' ? 'به پرو' : 'صندلی بیشتر') + '</span>', csv: DB.upgradeValue },
      col.owner,
    ],
  },
  winback: {
    label: 'بازگرداندنی', sort: { key: 'lost', dir: 'desc' },
    note: l => '<b>' + UI.fa(l.length) + '</b> مشتری در ۱۲۰ روز اخیر لغو کرده‌اند (' + UI.money(sum(l, lostMrr)) + ' در ماه). آن‌هایی که به‌خاطر «قیمت بالا» یا «پاسخی نداد» رفته‌اند، بهترین شانس بازگشت را دارند.',
    columns: [
      { key: 'name', label: 'مشتری', render: a => acc(a, UI.esc(C.plans[lostPlan(a)].name + ' · ' + a.industryName)), csv: a => a.name },
      { key: 'lost', label: 'درآمد ازدست‌رفته', num: true, sort: lostMrr, render: a => '<b>' + UI.compact(lostMrr(a)) + '</b>', csv: lostMrr },
      { key: 'reason', label: 'دلیل', render: a => '<span class="tag">' + UI.esc(a.churnReason) + '</span>', csv: a => a.churnReason },
      { key: 'tenure', label: 'مدت اشتراک', num: true, sort: churnTenure, render: a => dur(churnTenure(a)), csv: churnTenure },
      { key: 'since', label: 'از لغو', num: true, sort: a => -a.churnedAt, desc: true, render: a => '<span class="nowrap">' + UI.agoDays(a.churnedAt) + '</span><span class="s">' + UI.date(a.churnedAt) + '</span>', csv: a => a.churnedAt },
      col.owner,
    ],
  },
  pastdue: {
    label: 'پرداخت ناموفق', sort: { key: 'mrr', dir: 'desc' },
    note: l => '<b>' + UI.fa(l.length) + '</b> تمدید پرداخت نشده و اشتراک در دورهٔ مهلت است (' + UI.money(sum(l, a => a.mrr)) + ' در ماه). امروز تماس بگیرید و نتیجه را ثبت کنید.',
    columns: [
      col.acc, col.mrr,
      { key: 'retries', label: 'تلاش ناموفق', num: true, sort: a => lastInv(a).retries || 0, render: a => UI.fa(lastInv(a).retries || 0) + ' بار', csv: a => lastInv(a).retries || 0 },
      { key: 'inv', label: 'صورتحساب ناموفق', sort: a => -lastInv(a).t, render: a => '<span class="nowrap">' + UI.date(lastInv(a).t) + '</span><span class="s">' + UI.agoDays(lastInv(a).t) + ' · ' + UI.money(lastInv(a).amount) + '</span>', csv: a => UI.date(lastInv(a).t) },
      col.owner,
      { key: 'follow', label: 'آخرین پیگیری', nosort: true, render: a => { const n = UI.notes(a.id)[0]; return n ? '<span class="s" style="max-width:220px;white-space:normal">' + UI.esc(n.text) + '</span>' : '<span class="faint">ثبت نشده</span>'; }, csv: a => { const n = UI.notes(a.id)[0]; return n ? n.text : ''; } },
      { key: 'act', label: '', nosort: true, csv: false, render: a => '<button class="btn sm" data-log="' + a.id + '">' + UI.icon('phone') + 'ثبت پیگیری</button>' },
    ],
  },
  champions: {
    label: 'وفادار', sort: { key: 'mrr', dir: 'desc' },
    views: [
      { key: 'all', label: 'همه', test: null },
      { key: 'monthly', label: 'هنوز ماهانه', test: a => a.cycle === 'monthly' },
    ],
    note: l => { const m = l.filter(a => a.cycle === 'monthly'); return '<b>' + UI.fa(l.length) + '</b> مشتری بیش از ۶ ماه پیاپی پرداخت کرده‌اند و سالم‌اند — برای معرفی و نمونهٔ موردی سراغشان بروید. <b>' + UI.fa(m.length) + '</b> نفر هنوز ماهانه می‌پردازند؛ پیشنهاد سالانه (' + UI.pct(C.cycles.yearly.discount) + ' تخفیف) بدهید.'; },
    columns: [
      col.acc, col.plan,
      { key: 'tenure', label: 'پرداخت پیاپی', num: true, sort: a => a.tenureDays, render: a => dur(a.tenureDays), csv: a => a.tenureDays },
      col.mrr, col.health, col.owner,
    ],
  },
};
const KEYS = Object.keys(TABS);

UI.page({
  id: 'sales', title: 'میز فروش', sources: ['wallet', 'main'],
  sub: 'تمدیدها، فرصت‌های ارتقا، بازگرداندنی‌ها و پرداخت‌های ناموفق — روی هر ردیف بزنید تا نمای سریع باز شود',
  render(ctx) {
    const B = ctx.body;
    const r30 = paying.filter(a => a.renewIn <= 30), r30risk = r30.filter(a => a.health < RISK);
    const upVal = sum(lists.upsell, DB.upgradeValue), upNone = lists.upsell.filter(a => !UI.ownerOf(a)).length;
    const up = UI.compactParts(upVal);
    let h = '<div class="kpis">' +
      UI.kpi({ label: 'تمدید در ۳۰ روز آینده', value: UI.n(r30.length), unit: 'مشتری', href: '#renew', cmp: UI.money(sum(r30, a => a.mrr)) + ' در ماه' }) +
      UI.kpi({ label: 'تمدید در خطر · ۳۰ روز', value: UI.n(r30risk.length), unit: 'مشتری', href: '#renew', info: 'تمدید در ۳۰ روز آینده با امتیاز سلامت زیر ' + RISK, cmp: UI.money(sum(r30risk, a => a.mrr)) + ' · ' + UI.pct(r30.length ? r30risk.length / r30.length : 0) + ' تمدیدها' }) +
      UI.kpi({ label: 'ارزش فرصت‌های ارتقا', value: '+' + up.num, unit: up.unit + ' ' + CUR, href: '#upsell', info: 'اگر همهٔ حساب‌های آمادهٔ ارتقا یک پله بالا بروند، در ماه', cmp: UI.fa(lists.upsell.length) + ' حساب · ' + UI.fa(upNone) + ' بدون مسئول' }) +
      UI.kpi({ label: 'بازگرداندنی', value: UI.n(lists.winback.length), unit: 'مشتری', href: '#winback', info: 'لغو در ۱۲۰ روز اخیر', cmp: UI.money(sum(lists.winback, lostMrr)) + ' در ماه از دست رفته' }) +
      UI.kpi({ label: 'پرداخت ناموفق', value: UI.n(lists.pastdue.length), unit: 'مشتری', href: '#pastdue', cmp: UI.money(sum(lists.pastdue, a => a.mrr)) + ' در دورهٔ مهلت' }) +
      '</div>';

    // ---- renewal calendar (13 weeks) — every due date counts, so monthly plans appear each month
    const W = 13, ok = new Array(W).fill(0), risk = new Array(W).fill(0), nRisk = new Array(W).fill(0);
    for (const a of paying) {
      const step = C.cycles[a.cycle].days;
      for (let d = a.renewIn; d <= W * 7; d += step) {
        const k = Math.floor((d - 1) / 7); if (k < 0 || k >= W) continue;
        if (a.health < RISK) { risk[k] += a.mrr; nRisk[k]++; } else ok[k] += a.mrr;
      }
    }
    const wLabels = [], wTips = [];
    for (let k = 0; k < W; k++) { wLabels.push(UI.date(-(7 * k + 1))); wTips.push('هفتهٔ ' + UI.date(-(7 * k + 1)) + ' تا ' + UI.date(-(7 * k + 7))); }
    const week = paying.filter(a => a.renewIn <= 7 && a.health < RISK).sort((p, q) => q.mrr - p.mrr);
    h += '<div class="grid g-main">' +
      UI.card({ title: 'تقویم تمدید', hint: '۱۳ هفتهٔ آینده · درآمد ماهانه‌ای که سررسید می‌شود · تومان',
        body: '<div id="c-cal"></div><div class="legend" style="margin-top:8px"><span class="k"><i class="sw" style="background:var(--series-1)"></i>سالم (سلامت ' + UI.fa(RISK) + ' و بالاتر)</span><span class="k"><i class="sw" style="background:var(--critical)"></i>در خطر (سلامت زیر ' + UI.fa(RISK) + ')</span><span class="faint">اشتراک ماهانه هر ماه یک بار حساب شده</span></div>',
        foot: '<span>' + UI.fa(nRisk.reduce((t, x) => t + x, 0)) + ' سررسید در خطر · ' + UI.money(risk.reduce((t, x) => t + x, 0)) + '</span><a class="nowrap" href="#renew">فهرست تمدیدها</a>' }) +
      UI.card({ title: 'این هفته زنگ بزنید', hint: 'تمدید تا ۷ روز دیگر، سلامت زیر ' + UI.fa(RISK), flush: true,
        body: week.length ? '<div class="list" style="padding:0 16px">' + week.slice(0, 6).map(a => '<div class="li"><span class="main"><a class="t" href="' + UI.custLink(a) + '" data-acc="' + a.id + '">' + UI.esc(a.name) + '</a><span class="d">تمدید ' + UI.inDays(a.renewIn) + ' · ضعیف در «' + UI.esc(weakest(a).label) + '» · ' + UI.repName(UI.ownerOf(a), true) + '</span></span><span class="end">' + UI.healthScore(a.health) + '<div class="muted" style="font-size:11.5px;margin-top:2px">' + UI.compact(a.mrr) + '</div></span></div>').join('') + '</div>'
          : '<div class="empty"><b>تمدید پرخطری در این هفته نیست</b>تقویم را برای هفته‌های بعد ببینید.</div>',
        foot: '<span>' + UI.fa(week.length) + ' مشتری · ' + UI.money(sum(week, a => a.mrr)) + '</span><a class="nowrap" href="#renew">همه در فهرست</a>' }) +
      '</div>';

    // ---- workspace
    h += '<section class="card" id="ws" style="scroll-margin-top:70px"><div class="tabs" id="tabs" role="tablist" style="padding:4px 12px 0">' +
      KEYS.map(k => '<button role="tab" data-tab="' + k + '">' + UI.esc(TABS[k].label) + '<span class="n">' + UI.fa(lists[k].length) + '</span></button>').join('') +
      '</div><div class="note" id="tnote" style="padding:12px 16px 0"></div><div id="tt"></div></section>';

    B.innerHTML = h;

    Charts.columns(B.querySelector('#c-cal'), {
      labels: wLabels, tipLabels: wTips, height: 290, total: 'جمع',
      yFormat: v => UI.compact(v), tipFormat: v => UI.money(v),
      series: [{ name: 'سالم', values: ok, color: 'var(--series-1)' }, { name: 'در خطر', values: risk, color: 'var(--critical)' }],
    });

    const tabsEl = B.querySelector('#tabs'), noteEl = B.querySelector('#tnote'), tt = B.querySelector('#tt');
    let cur = null;
    function show(key, scroll) {
      if (!TABS[key]) key = 'renew';
      const T = TABS[key];
      tabsEl.querySelectorAll('button').forEach(b => { const on = b.dataset.tab === key; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
      UI.setParam('tab', key === 'renew' ? null : key);
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      noteEl.innerHTML = T.note(lists[key]);
      cur = UI.table(tt, {
        rows: lists[key], columns: T.columns, views: T.views, sort: T.sort, select: true, compact: true,
        exportName: 'sales-' + key, unit: 'مشتری', onRow: a => UI.openAccount(a.id),
        search: { placeholder: 'نام، شخص یا شماره…', text: a => a.name + ' ' + a.contact.first + ' ' + a.contact.last + ' ' + a.contact.mobile },
        filters: [{ key: 'owner', label: 'مسئول', options: [{ v: 'none', l: 'بدون مسئول' }].concat(C.reps.map(r => ({ v: r.id, l: r.name }))), test: (a, v) => v === 'none' ? !UI.ownerOf(a) : UI.ownerOf(a) === v }],
        emptyTitle: 'موردی نیست', empty: 'فیلتر یا جستجو را تغییر دهید.',
        bulk: [],
        bulkWire(el, sel, done) {
          const bar = el.querySelector('.bulkbar'); if (!bar) return;
          const s = document.createElement('span'); s.className = 'row'; s.style.gap = '6px';
          s.innerHTML = '<select class="select" style="height:27px;font-size:12px"><option value="">تعیین مسئول…</option>' + C.reps.map(r => '<option value="' + r.id + '">' + UI.esc(r.name) + '</option>').join('') + '<option value="__none">بدون مسئول</option></select>';
          bar.insertBefore(s, bar.querySelector('[data-unsel]'));
          s.querySelector('select').onchange = ev => {
            const v = ev.target.value; if (!v) return;
            const rows = sel();
            UI.setOwner(rows.map(a => a.id), v === '__none' ? null : v);
            UI.toast(UI.fa(rows.length) + ' مشتری به ' + (v === '__none' ? 'بدون مسئول' : DB.rep(v).name) + ' داده شد');
            done();
            noteEl.innerHTML = T.note(lists[key]);
          };
        },
      });
      UI.setListNav({ move: d => cur.moveFocus(d), open: () => cur.openFocus() });
      if (scroll) B.querySelector('#ws').scrollIntoView({ block: 'start' });
    }
    tabsEl.querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.tab));
    tt.addEventListener('click', ev => {
      const b = ev.target.closest('[data-log]'); if (!b) return;
      const a = DB.byId.get(+b.dataset.log);
      UI.logOutcome(a, 'pastdue:' + a.id, () => cur.redraw());
    });
    const fromHash = () => { const k = location.hash.slice(1); return TABS[k] ? k : null; };
    const first = fromHash();
    show(first || UI.param('tab') || 'renew', false);
    if (first) setTimeout(() => B.querySelector('#ws').scrollIntoView({ block: 'start' }), 0);
    window.onhashchange = () => { const k = fromHash(); if (k) show(k, true); };
  },
});
})();
</script>
</body>
</html>
