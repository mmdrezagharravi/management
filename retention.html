<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نگهداشت — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
<style>#t-churn table.tbl { min-width: 640px; }</style>
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { agg, accounts, CONFIG: C } = DB;

// MRR of one account at the end of day t (days ago) — same rule as agg.mrrAt
const mrrAt = (a, t) => { let v = 0; for (const pe of a.planEvents) { if (pe.t >= t) v = pe.mrr; else break; } return v; };
// revenue retention of the accounts paying at `from`, measured at `to`
function revRet(from, to) {
  let S = 0, E = 0, G = 0, exp = 0, lost = 0, n = 0;
  for (const a of accounts) {
    const s = mrrAt(a, from); if (!s) continue;
    const e = mrrAt(a, to);
    n++; S += s; E += e; G += Math.min(s, e);
    if (e > s) exp += e - s; else lost += s - e;
  }
  return { n, S, E, exp, lost, nrr: S ? E / S : null, grr: S ? G / S : null };
}
// paying at t0+30 that churned inside [t0, t0+30)
function logoChurn(t0) {
  const base = accounts.filter(a => mrrAt(a, t0 + 30) > 0);
  const lost = base.filter(a => a.planEvents.some(pe => pe.kind === 'churn' && pe.t < t0 + 30 && pe.t >= t0));
  return { n: lost.length, base: base.length, r: base.length ? lost.length / base.length : 0 };
}
const lastMrr = a => { for (let i = a.planEvents.length - 1; i >= 0; i--) if (a.planEvents[i].mrr > 0) return a.planEvents[i].mrr; return 0; };
const tenure = a => a.planEvents.length ? a.planEvents[0].t - a.churnedAt : 0;
const months = d => d < 30 ? UI.fa(d) + ' روز' : UI.fa(Math.round(d / 30.4)) + ' ماه';

UI.page({
  id: 'retention', title: 'نگهداشت', sources: ['main', 'behavior', 'wallet'],
  sub: 'آیا مشتری‌ها می‌مانند؟ — کوهورت‌های ماهانه، منحنی هفتگی و نگهداشت درآمد',
  render(ctx) {
    const B = ctx.body;
    const all = agg.cohorts(12);

    // ---------------------------------------------------------------- KPIs
    const monthK = k => {
      const c = all.filter(r => !r.partial && r.cells[k] != null);
      const avg = rows => rows.length ? rows.reduce((t, r) => t + r.cells[k], 0) / rows.length : null;
      const cur = c.slice(-3), prev = c.slice(-6, -3);
      return { v: avg(cur), p: prev.length === 3 ? avg(prev) : null, names: cur.map(r => UI.monthLabel(r)).join('، ') };
    };
    const m1 = monthK(1), m3 = monthK(3);
    const lc = logoChurn(0), lcp = logoChurn(30);
    const r90 = revRet(90, 0), r90p = revRet(180, 90);
    let h = '<div class="kpis">' +
      UI.kpi({ label: 'نگهداشت ماه ۱', value: UI.pct(m1.v), info: 'سهم حساب‌هایی که در ماه دوم پس از ثبت‌نام دست‌کم یک هفته فعال بوده‌اند — میانگین ۳ کوهورت آخر', delta: UI.delta(m1.v, m1.p, { points: true }), cmp: m1.names }) +
      UI.kpi({ label: 'نگهداشت ماه ۳', value: UI.pct(m3.v), info: 'همان تعریف برای ماه چهارم پس از ثبت‌نام — میانگین ۳ کوهورت آخر', delta: UI.delta(m3.v, m3.p, { points: true }), cmp: m3.names }) +
      UI.kpi({ label: 'ریزش مشتری ۳۰ روز', value: UI.pct(lc.r, 1), info: 'مشتریان پرداخت‌کننده‌ای که در ۳۰ روز اخیر لغو کرده‌اند ÷ پرداخت‌کنندگان ۳۰ روز پیش', href: '#churned',
        delta: UI.delta(lc.r, lcp.r, { points: true, goodUp: false }), cmp: UI.n(lc.n) + ' از ' + UI.n(lc.base) + ' مشتری' }) +
      UI.kpi({ label: 'نگهداشت خالص درآمد (NRR)', value: UI.pct(r90.nrr, 1), info: 'MRR امروزِ مشتریانی که ۹۰ روز پیش پرداخت‌کننده بودند ÷ MRR همان‌ها در ۹۰ روز پیش — با احتساب ارتقا، کاهش و ریزش', href: 'revenue.html',
        delta: UI.delta(r90.nrr, r90p.nrr, { points: true }), cmp: '۹۰ روز · ' + UI.n(r90.n) + ' مشتری' }) +
      UI.kpi({ label: 'نگهداشت ناخالص درآمد (GRR)', value: UI.pct(r90.grr, 1), info: 'مثل NRR ولی ارتقا حساب نمی‌شود؛ فقط کاهش و ریزش را نشان می‌دهد', href: 'revenue.html',
        delta: UI.delta(r90.grr, r90p.grr, { points: true }), cmp: 'ازدست‌رفته: ' + UI.compact(r90.lost) }) +
      '</div>';

    // ------------------------------------------------------------ heatmap
    h += UI.card({ title: 'نگهداشت کوهورت‌های ماهانه', hint: 'درصد حساب‌های فعال در هر ماه پس از ثبت‌نام',
      acts: '<div class="seg" id="coh-seg" role="group" aria-label="گروه"><button data-m="all">همه</button><button data-m="paid">فقط پرداخت‌کننده‌ها</button></div>' +
        '<select class="select" id="coh-src" aria-label="منبع جذب" style="height:31px"><option value="">منبع: همه</option>' + C.sources.map(s => '<option value="' + s.key + '">' + UI.esc(s.name) + '</option>').join('') + '</select>',
      body: '<div class="tbl-wrap"><div id="heat" style="min-width:760px"></div></div>' +
        '<div class="row wrap between" style="gap:8px 16px;margin-top:10px"><div class="note">هر ردیف = حساب‌هایی که در آن ماه ثبت‌نام کرده‌اند (عدد کنار ماه = تعداد). <b>رو به چپ</b> بخوانید تا ببینید کجا می‌روند؛ <b>رو به پایین</b> تا ببینید کوهورت‌های تازه بهترند یا نه.</div>' +
        '<div class="legend"><span class="muted">کم‌تر</span>' + ['--seq-100', '--seq-250', '--seq-400', '--seq-500', '--seq-700'].map(v => '<i class="sw" style="background:var(' + v + ')"></i>').join('') + '<span class="muted">بیش‌تر</span></div></div>' });

    // ------------------------------------------------- curves + revenue
    const cA = agg.retentionCurve(a => !!a.feat.automation, 12);
    const cN = agg.retentionCurve(a => !a.feat.automation, 12);
    const cT = agg.retentionCurve(a => a.milestones.team !== undefined, 12);
    const lift = cN[12] ? cA[12] / cN[12] : null;
    const active30 = accounts.filter(a => a.lastSeenDays < 30);
    const autoShare = active30.length ? active30.filter(a => a.feat.automation).length / active30.length : 0;
    const payNoAuto = accounts.filter(a => a.paying && !a.feat.automation).length;
    const insight = UI.card({ cls: 'tint-accent', title: UI.icon('zap') + 'اتوماسیون، قوی‌ترین نشانهٔ ماندن',
      body: '<div class="prose">در هفتهٔ ۱۲ پس از ثبت‌نام، <b>' + UI.pct(cA[12]) + '</b> از حساب‌های دارای اتوماسیون هنوز فعال‌اند؛ بقیه فقط <b>' + UI.pct(cN[12]) + '</b> — یعنی <b>' + UI.n(lift, 1) + ' برابر</b>. ' +
        'اما تنها ' + UI.pct(autoShare) + ' از حساب‌های فعال اتوماسیون دارند و ' + UI.n(payNoAuto) + ' مشتری پرداخت‌کننده هنوز یکی هم نساخته‌اند. برایشان قالب اتوماسیون آماده بفرستید و در دموی فروش به حساب‌های رایگان، اتوماسیون را اول نشان دهید.</div>',
      foot: '<span>همبستگی است، نه اثبات علت</span><a href="features.html">اثر قابلیت‌ها بر نگهداشت</a>' });

    const mos = DB.jalaliMonths(6).map(mo => ({ mo, ...revRet(mo.start + 1, mo.end) }));
    const revTbl = '<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>ماه</th><th class="num">MRR ابتدای ماه</th><th class="num">ارتقا</th><th class="num">کاهش و ریزش</th><th class="num">NRR</th><th class="num">GRR</th></tr></thead><tbody>' +
      mos.map(r => '<tr><td class="nowrap"><b>' + UI.monthLabel(r.mo, true) + '</b>' + (r.mo.end === 0 ? ' <span class="faint">تا امروز</span>' : '') + '</td><td class="num">' + UI.compact(r.S) + '</td><td class="num">+' + UI.compact(r.exp) + '</td><td class="num">−' + UI.compact(r.lost) + '</td>' +
        '<td class="num"><b>' + UI.pct(r.nrr, 1) + '</b></td><td class="num">' + UI.pct(r.grr, 1) + '</td></tr>').join('') + '</tbody></table></div>';

    h += insight + '<div class="grid g2">' +
      UI.card({ title: 'منحنی نگهداشت هفتگی', hint: 'سهم فعال در هر هفته پس از ثبت‌نام', body: '<div id="c-curve"></div>' +
        '<div class="legend" style="margin-top:8px"><span class="k"><i class="ln" style="background:var(--series-1)"></i>با اتوماسیون <span class="faint">(' + UI.n(cA.n) + ' حساب)</span></span>' +
        '<span class="k"><i class="ln" style="background:var(--series-2)"></i>بدون اتوماسیون <span class="faint">(' + UI.n(cN.n) + ')</span></span>' +
        '<span class="k"><i class="ln" style="background:var(--series-3)"></i>تیمی — همکار دعوت کرده <span class="faint">(' + UI.n(cT.n) + ')</span></span></div>',
        foot: '<span>حساب‌هایی که دست‌کم ۱۲ هفته از ثبت‌نامشان گذشته</span><a href="segments.html">دسته‌بندی‌ها</a>' }) +
      UI.card({ title: 'نگهداشت درآمد ماهانه', hint: '۶ ماه اخیر · تومان', flush: true, body: revTbl,
          foot: '<span>NRR = MRR پایان ماهِ مشتریان اول ماه ÷ MRR اول ماهشان</span><a href="revenue.html">درآمد</a>' }) +
      '</div>';

    // ------------------------------------------------------------ churn
    const churned = accounts.filter(a => a.churnedAt !== undefined && a.churnedAt <= 180);
    const reasons = C.churnReasons.map(r => { const l = churned.filter(a => a.churnReason === r); return { r, n: l.length, mrr: l.reduce((t, a) => t + lastMrr(a), 0) }; }).sort((p, q) => q.n - p.n);
    const lostMrr = churned.reduce((t, a) => t + lastMrr(a), 0);
    const early = churned.filter(a => tenure(a) < 92).length;
    const medTen = (() => { const v = churned.map(tenure).sort((p, q) => p - q); return v.length ? v[v.length >> 1] : 0; })();
    const facts = '<div style="margin-top:12px;border-top:1px solid var(--grid);padding-top:6px">' +
      '<div class="kv"><span class="k">MRR ازدست‌رفته در ۱۸۰ روز</span><span class="v">' + UI.money(lostMrr) + '</span></div>' +
      '<div class="kv"><span class="k">میانهٔ مدت اشتراک پیش از لغو</span><span class="v">' + months(medTen) + '</span></div>' +
      '<div class="kv"><span class="k">لغو در سه ماه اول</span><span class="v">' + UI.n(early) + ' مشتری · ' + UI.pct(churned.length ? early / churned.length : 0) + '</span></div></div>';
    h += '<div class="grid g-main">' +
      UI.card({ id: 'churned', title: 'آخرین مشتریان ازدست‌رفته', hint: '۱۸۰ روز اخیر · روی ردیف بزنید', flush: true, body: '<div id="t-churn"></div>' }) +
      UI.card({ title: 'دلیل لغو اشتراک', hint: UI.n(churned.length) + ' مشتری در ۱۸۰ روز', body: '<div id="c-reason"></div>' + facts,
        foot: '<span>دلیلی که مشتری هنگام لغو انتخاب کرده</span><a href="health.html">مشتریان در خطر</a>' }) +
      '</div>';
    B.innerHTML = h;

    // heatmap with its own filter (kept in the URL)
    const seg = B.querySelector('#coh-seg'), sel = B.querySelector('#coh-src');
    const drawHeat = () => {
      let mode = UI.param('coh') || 'all';
      if (mode !== 'all' && mode !== 'paid' && !DB.source(mode)) mode = 'all';
      seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
      sel.value = DB.source(mode) ? mode : '';
      const filter = mode === 'paid' ? a => a.everPaid : DB.source(mode) ? a => a.source === mode : null;
      const rows = agg.cohorts(12, filter);
      const later = []; rows.forEach(r => r.cells.forEach((v, k) => { if (k && v != null) later.push(v); }));
      const cols = []; for (let k = 0; k < 12; k++) cols.push('ماه ' + UI.fa(k));
      Charts.heat(B.querySelector('#heat'), {
        rowHead: 'ماه ثبت‌نام', cols, tipLabel: 'فعال',
        domain: later.length ? [Math.min(...later), Math.max(...later)] : [0, 1],
        rows: rows.map(r => {
          const cells = []; for (let k = 0; k < 12; k++) cells.push(r.cells[k] != null && !r.partial ? r.cells[k] : null);
          return { label: UI.monthLabel(r, true) + ' ', sub: UI.n(r.size) + ' حساب' + (r.partial ? ' · ناتمام' : ''), cells,
            tips: cells.map(v => v == null ? '' : UI.n(Math.round(v * r.size)) + ' از ' + UI.n(r.size) + ' حساب') };
        }),
      });
    };
    seg.querySelectorAll('button').forEach(b => b.onclick = () => { UI.setParam('coh', b.dataset.m === 'all' ? null : b.dataset.m); drawHeat(); });
    sel.onchange = () => { UI.setParam('coh', sel.value || null); drawHeat(); };
    drawHeat();

    const wl = []; for (let w = 0; w <= 12; w++) wl.push('هفتهٔ ' + UI.fa(w));
    Charts.line(B.querySelector('#c-curve'), {
      labels: wl, height: 250, yFormat: v => UI.pct(v), area: false,
      series: [{ name: 'با اتوماسیون', values: cA }, { name: 'بدون اتوماسیون', values: cN }, { name: 'تیمی', values: cT }],
    });

    Charts.hbars(B.querySelector('#c-reason'), { labelWidth: 108, format: v => UI.n(v),
      items: reasons.map(r => ({ label: r.r, sub: UI.compact(r.mrr) + ' MRR', value: r.n, note: UI.pct(churned.length ? r.n / churned.length : 0) })) });

    // the shared pager's size menu lists 25/50/100 only; show our 10-row default instead of a wrong "25"
    const tc = B.querySelector('#t-churn');
    new MutationObserver(() => {
      const s = tc.querySelector('[data-size]');
      if (s && !s.querySelector('option[selected]') && !s.querySelector('option[value="10"]')) { s.insertAdjacentHTML('afterbegin', '<option value="10">' + UI.fa(10) + ' ردیف</option>'); s.value = '10'; }
    }).observe(tc, { childList: true });
    UI.table(tc, {
      rows: churned, pageSize: 10, exportName: 'churned', unit: 'مشتری', compact: true,
      sort: { key: 'when', dir: 'asc' },
      filters: [{ key: 'reason', label: 'دلیل', options: C.churnReasons.map(r => ({ v: r, l: r })), test: (a, v) => a.churnReason === v }],
      onRow: a => UI.openAccount(a.id),
      columns: [
        { key: 'name', label: 'مشتری', render: a => UI.acctCell(a, { sub: UI.esc(a.industryName) + ' · ' + UI.esc(a.city) }), csv: a => a.name },
        { key: 'when', label: 'لغو', sort: a => a.churnedAt, render: a => '<span class="nowrap">' + UI.date(a.churnedAt) + '</span><span class="s">' + UI.agoDays(a.churnedAt) + '</span>', csv: a => a.churnedAt },
        { key: 'lost', label: 'MRR ازدست‌رفته', num: true, sort: lastMrr, render: a => '<b>' + UI.compact(lastMrr(a)) + '</b>', csv: lastMrr },
        { key: 'reason', label: 'دلیل', sort: a => a.churnReason, render: a => UI.esc(a.churnReason), csv: a => a.churnReason },
        { key: 'tenure', label: 'مدت اشتراک', num: true, sort: tenure, render: a => months(tenure(a)), csv: tenure },
        { key: 'owner', label: 'مسئول', sort: a => UI.ownerOf(a) || 'zz', render: a => UI.repName(UI.ownerOf(a), true), csv: a => { const o = UI.ownerOf(a); return o ? DB.rep(o).name : ''; } },
      ],
    });
  },
});
})();
</script>
</body>
</html>
