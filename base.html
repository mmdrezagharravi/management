<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جزئیات بیس — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { CONFIG: C } = DB;

// A base cannot have been last active before it existed.
const lastAct = b => Math.min(b.lastActive, b.created);

const reqId = +UI.param('id');
let base = reqId ? DB.base(reqId) : null;
const missing = !!reqId && !base;
if (!base) base = DB.bases().filter(b => DB.byId.get(b.accountId).paying).sort((p, q) => q.records - p.records)[0];
const a = DB.byId.get(base.accountId);
const L = C.plans[a.plan].limits;
const recTotal = a.bases.reduce((t, x) => t + x.records, 0);
const share = recTotal ? base.records / recTotal : 1 / a.bases.length;
// On capped plans the account holds at most a.records; scale its bases down so they add up to that.
const recsOf = x => recTotal > a.records ? Math.round(x.records * a.records / recTotal) : x.records;
const bRec = recsOf(base);
const autoShare = a.automations ? base.automations / a.automations : 0;
const runsEst = Math.round(a.runs30 * autoShare);
const la = lastAct(base);
const seatLim = (a.usage.find(u => u.key === 'seats') || {}).limit || a.seats;
const accLink = '<a href="' + UI.custLink(a) + '" data-acc="' + a.id + '">' + UI.esc(a.name) + '</a>';

function cell(label, value, sub) {
  return '<div style="border:1px solid var(--border);border-radius:9px;padding:10px 12px;min-width:0">' +
    '<div class="muted" style="font-size:11.5px;font-weight:600">' + label + '</div>' +
    '<div style="font-weight:800;font-size:20px;line-height:1.4;font-variant-numeric:tabular-nums">' + value + '</div>' +
    '<div class="faint" style="font-size:11px;line-height:1.5">' + (sub || '&nbsp;') + '</div></div>';
}

UI.page({
  id: 'base', nav: 'bases', title: base.name, sources: ['main'],
  crumbs: '<a href="bases.html">بیس‌ها</a> › ' + accLink + ' › ' + UI.esc(base.name),
  sub: '<span class="mono">/' + UI.esc(base.slug) + '</span> · ' + UI.planBadge(a.plan) + ' · ' + UI.esc(a.industryName) + ' · ' + UI.esc(a.city),
  actions: () => '<button class="btn" id="qv">' + UI.icon('eye') + 'نمای سریع حساب</button><a class="btn primary" href="' + UI.custLink(a) + '">' + UI.icon('user') + 'پروفایل مشتری</a>',
  render(ctx) {
    const B = ctx.body;
    ctx.el.querySelector('#qv').onclick = () => UI.openAccount(a.id);

    let h = missing ? '<div class="banner info">' + UI.icon('info') + '<div>بیسی با شناسهٔ ' + UI.fa(reqId) + ' پیدا نشد؛ پربارترین بیس مشتریان پرداخت‌کننده نمایش داده شده. <a href="bases.html">فهرست بیس‌ها</a></div></div>' : '';

    const autoCmp = !base.automations ? (L.runs ? 'اتوماسیونی ندارد — فرصت آموزش' : 'پلن رایگان اجرای اتوماسیون ندارد')
      : !L.runs ? 'پلن رایگان اجرای اتوماسیون ندارد'
      : '≈ ' + UI.n(runsEst) + ' اجرا در ۳۰ روز · ' + UI.pct(autoShare) + ' از اجراهای حساب';
    h += '<div class="kpis">' +
      UI.kpi({ label: 'عمر بیس', value: UI.n(base.created), unit: 'روز', cmp: 'ساخته‌شده ' + UI.date(base.created) }) +
      UI.kpi({ label: 'رکورد', value: UI.n(bRec), info: 'سقف رکورد برای کل حساب است، نه هر بیس',
        cmp: UI.meter('', a.records, L.records, { fmt: UI.compact }) + '<div style="margin-top:3px">کل حساب · ' + UI.pct(share) + ' آن در این بیس</div>' }) +
      UI.kpi({ label: 'جدول', value: UI.n(base.tables), cmp: 'میانگین ' + UI.n(bRec / Math.max(1, base.tables)) + ' رکورد در هر جدول' }) +
      UI.kpi({ label: 'اتوماسیون', value: UI.n(base.automations), info: 'اجراها سهم این بیس از اجرای ۳۰ روز حساب است (به نسبت تعداد اتوماسیون)', cmp: autoCmp }) +
      UI.kpi({ label: 'همکار', value: UI.n(base.collaborators), unit: 'از ' + UI.n(seatLim) + ' صندلی', cmp: UI.n(a.activeMembers7) + ' عضو حساب این هفته فعال بوده‌اند' }) +
      UI.kpi({ label: 'آخرین فعالیت', value: UI.agoDays(la), cmp: la === 0 && a.online ? '<span class="live"><i></i>هم‌اکنون آنلاین</span>' : UI.date(la) }) +
      '</div>';

    // --- daily activity (estimate)
    const days = 90, vals = [], labels = [];
    for (let d = days - 1; d >= 0; d--) {
      vals.push(d >= la && d <= base.created ? Math.round(a.ev[d] * share) : 0);
      labels.push(UI.date(d));
    }
    const activeDays = vals.filter(v => v > 0).length, sumEv = vals.reduce((t, v) => t + v, 0);

    // --- people
    const people = a.members.slice(0, base.collaborators);
    const shown = people.slice(0, 8);
    const peopleHtml = '<div class="list" style="padding:0 16px">' + shown.map(m =>
      '<div class="li"><span class="avatar">' + UI.esc(UI.initials(m.name)) + '</span><span class="main"><span class="t">' + UI.esc(m.name) + '</span><span class="d">' + UI.esc(m.role) + ' · آخرین بازدید ' + UI.esc(UI.agoDays(m.lastSeen)) + '</span></span>' +
      '<span class="end">' + (m.lastSeen <= 6 ? UI.statusBadge('good', 'فعال این هفته') : '<span class="faint">غیرفعال</span>') + '</span></div>').join('') + '</div>';

    // --- sibling bases
    const sib = a.bases.filter(x => x.id !== base.id).sort((p, q) => q.records - p.records);
    const sibHtml = sib.length ? '<div class="list" style="padding:0 16px">' + sib.map(x =>
      '<a class="li" href="base.html?id=' + x.id + '">' + UI.icon('db', 'faint') + '<span class="main"><span class="t">' + UI.esc(x.name) + '</span><span class="d"><span class="mono">/' + UI.esc(x.slug) + '</span> · آخرین فعالیت ' + UI.esc(UI.agoDays(lastAct(x))) + '</span></span><span class="end"><b>' + UI.n(recsOf(x)) + '</b> <span class="muted">رکورد</span></span></a>').join('') + '</div>'
      : '<div class="note" style="padding:0 16px 14px">این تنها بیس این حساب است. حساب‌های چندبیسی بیشتر می‌مانند — در تماس بعدی ساخت بیس دوم را پیشنهاد دهید.</div>';

    // --- account summary + next step
    const mu = a.maxUsage;
    const up = mu && mu.ratio >= 0.8;
    const accBody = '<div class="row" style="gap:10px;margin-bottom:8px"><span class="avatar lg">' + UI.esc(UI.initials(a.name)) + '</span><div style="min-width:0"><a href="' + UI.custLink(a) + '" data-acc="' + a.id + '" style="font-weight:800;font-size:14.5px">' + UI.esc(a.name) + '</a>' +
        '<div class="row wrap" style="gap:8px;font-size:12px;color:var(--muted)">' + UI.planBadge(a.plan) + (a.paying ? '<span>' + UI.money(a.mrr) + ' در ماه</span>' : '') + '</div></div></div>' +
      '<div class="kv"><span class="k">امتیاز سلامت</span><span class="v">' + UI.healthScore(a.health) + '</span></div>' +
      '<div class="kv"><span class="k">مسئول</span><span class="v">' + UI.repName(UI.ownerOf(a)) + '</span></div>' +
      '<div class="kv"><span class="k">بیس‌ها</span><span class="v">' + UI.n(a.bases.length) + ' بیس · ' + UI.n(a.memberCount) + ' عضو</span></div>' +
      (a.paying ? '<div class="kv"><span class="k">تمدید بعدی</span><span class="v">' + UI.date(-a.renewIn) + ' · ' + UI.inDays(a.renewIn) + '</span></div>' : '') +
      (up ? '<div style="margin-top:10px">' + UI.meter(mu.label, mu.used, mu.limit) + '</div>' : '');

    const ownershipCard = UI.card({ title: 'تاریخچهٔ انتقال مالکیت', hint: 'هنوز ذخیره نمی‌شود',
      body: '<div class="kv"><span class="k">مالک فعلی</span><span class="v">' + UI.esc(a.members[0].name) + '</span></div>' +
        '<div class="note" style="margin-top:8px"><code class="mono">transferBaseCreator</code> فقط <code class="mono">Base.creator</code> را عوض می‌کند و ردی از مالک قبلی، زمان و انجام‌دهنده نمی‌ماند؛ برای همین این کارت خالی است.</div>' +
        '<div class="note" style="margin-top:6px"><b>راه‌حل:</b> همین mutation هر انتقال را (بیس، مالک قبلی، مالک جدید، انجام‌دهنده، زمان) با <code class="mono">LogFactory</code> ثبت کند تا این تاریخچه از داده‌ی واقعی پر شود.</div>' });

    h += '<div class="grid g-main">' +
      '<div class="stack">' +
        UI.card({ title: 'فعالیت روزانه', hint: 'تخمینی · رویدادهای حساب × سهم این بیس از رکوردها (' + UI.pct(share) + ') · ۹۰ روز',
          body: '<div id="c-act"></div>',
          foot: '<span>' + UI.n(activeDays) + ' روز فعال در ۹۰ روز · حدود ' + UI.n(sumEv) + ' رویداد</span><a href="' + UI.custLink(a) + '">فعالیت دقیق حساب</a>' }) +
        UI.card({ title: 'محتوای بیس',
          body: '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px">' +
            cell('جدول', UI.n(base.tables), UI.n(bRec / Math.max(1, base.tables)) + ' رکورد در هر جدول') +
            cell('رکورد', UI.n(bRec), 'سقف حساب: ' + UI.compact(L.records)) +
            cell('صفحهٔ درگاه', base.pages ? UI.n(base.pages) : '<span class="faint">—</span>', base.pages ? 'درگاه منتشرشده' : (C.planOrder.indexOf(a.plan) < 2 ? 'درگاه از پلن پرو' : 'هنوز درگاهی نساخته')) +
            cell('نمای اشتراکی', base.shares ? UI.n(base.shares) : '<span class="faint">—</span>', base.shares ? 'لینک عمومی یا مهمان' : 'اشتراکی نساخته') +
            cell('اتوماسیون', base.automations ? UI.n(base.automations) : '<span class="faint">—</span>', L.runs ? 'سقف حساب: ' + UI.compact(L.runs) + ' اجرا در ماه' : 'در پلن رایگان اجرا نمی‌شود') +
            '</div>',
          foot: '<span>منبع: Base · Table · Page · ShareView · Automation</span><a href="bases.html">همهٔ بیس‌ها</a>' }) +
        UI.card({ title: 'بیس‌های دیگر این حساب', hint: sib.length ? UI.n(sib.length) + ' بیس' : '', flush: true, body: sibHtml }) +
        ownershipCard +
      '</div>' +
      '<div class="stack">' +
        UI.card({ title: 'حساب', body: accBody,
          foot: up ? '<span>' + UI.pct(mu.ratio) + ' سقف ' + UI.esc(mu.label) + ' پر شده</span><a href="quota.html?view=' + mu.key + '">' + (a.plan === 'free' || a.plan === 'basic' ? 'پیشنهاد ارتقا' : 'افزایش سهمیه') + '</a>'
            : '<span>' + UI.esc(a.contact.first + ' ' + a.contact.last) + ' · مالک حساب</span><a href="' + UI.custLink(a) + '">پروفایل کامل</a>' }) +
        UI.card({ title: 'افراد این بیس', hint: UI.n(base.collaborators) + ' همکار از ' + UI.n(a.memberCount) + ' عضو حساب', flush: true, body: peopleHtml,
          foot: people.length > shown.length ? '<span>و ' + UI.n(people.length - shown.length) + ' نفر دیگر</span><a href="' + UI.custLink(a) + '">همهٔ اعضا در پروفایل</a>' : '' }) +
      '</div>' +
      '</div>';

    B.innerHTML = h;
    Charts.columns(B.querySelector('#c-act'), {
      labels, tipLabels: labels.map(l => l), height: 210,
      series: [{ name: 'رویداد (تخمینی)', values: vals }],
    });
  },
});
})();
</script>
</body>
</html>
