<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>همهٔ مشتریان — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { accounts, CONFIG: C } = DB;
const me = UI.me();
const mineKey = me.role === 'rep' ? me.rep : null;

UI.page({
  id: 'customers', title: 'همهٔ مشتریان', sources: ['main', 'behavior'], noBanner: true,
  sub: UI.n(accounts.length) + ' حساب · ' + UI.n(accounts.filter(a => a.paying).length) + ' پرداخت‌کننده — روی هر ردیف بزنید تا نمای سریع باز شود',
  render(ctx) {
    ctx.body.innerHTML = '<div class="card" id="tb"></div><div class="note">«روند ۳۰ روز» تعداد ویرایش‌های روزانه است؛ «سیگنال» یعنی برخورد با سقف پلن یا بازدید صفحهٔ قیمت در ۳۰ روز اخیر. ستون‌ها قابل مرتب‌سازی‌اند و فیلترها در نشانی صفحه ذخیره می‌شوند تا بتوانید لینکش را برای همکار بفرستید.</div>';
    const views = [
      { key: 'paying', label: 'پرداخت‌کننده', test: a => a.paying },
      ...(mineKey ? [{ key: 'mine', label: 'مشتریان من', test: a => UI.ownerOf(a) === mineKey }] : []),
      { key: 'risk', label: 'در خطر', test: a => a.paying && a.health < 50 },
      { key: 'upsell', label: 'آمادهٔ ارتقا', test: a => a.segments.includes('upsell') },
      { key: 'pastdue', label: 'پرداخت ناموفق', test: a => a.pastDue },
      { key: 'new', label: 'تازه‌وارد (۱۴ روز)', test: a => a.age <= 14 },
      { key: 'unassigned', label: 'سرنخ بدون مسئول', test: a => (a.paying || a.segments.includes('upsell')) && !UI.ownerOf(a) },
      { key: 'active', label: 'فعال در ۳۰ روز', test: a => a.lastSeenDays <= 30 },
      { key: 'all', label: 'همه', test: null },
    ];
    const bands = C.health.bands;
    const t = UI.table(ctx.body.querySelector('#tb'), {
      rows: accounts, url: true, select: true, exportName: 'customers', unit: 'مشتری',
      views, defaultView: mineKey ? 'mine' : 'paying',
      sort: { key: 'mrr', dir: 'desc' },
      search: { placeholder: 'نام، شخص، شماره یا ایمیل…', text: a => a.name + ' ' + a.contact.first + ' ' + a.contact.last + ' ' + a.contact.mobile + ' ' + a.contact.email + ' ' + a.slug },
      filters: [
        { key: 'plan', label: 'پلن', options: C.planOrder.map(k => ({ v: k, l: C.plans[k].name })), test: (a, v) => a.plan === v },
        { key: 'health', label: 'سلامت', options: bands.map(b => ({ v: b.key, l: b.label })), test: (a, v) => a.band.key === v },
        { key: 'owner', label: 'مسئول', options: [{ v: 'none', l: 'بدون مسئول' }].concat(C.reps.map(r => ({ v: r.id, l: r.name }))), test: (a, v) => v === 'none' ? !UI.ownerOf(a) : UI.ownerOf(a) === v },
        { key: 'source', label: 'منبع', options: C.sources.map(s => ({ v: s.key, l: s.name })), test: (a, v) => a.source === v },
        { key: 'city', label: 'شهر', options: [...new Set(accounts.map(a => a.city))].map(c => ({ v: c, l: c })), test: (a, v) => a.city === v },
      ],
      onRow: a => UI.openAccount(a.id),
      columns: [
        { key: 'name', label: 'مشتری', render: a => UI.acctCell(a), csv: a => a.name },
        { key: 'plan', label: 'پلن', sort: a => C.planOrder.indexOf(a.plan) * 1e9 + a.mrr, desc: true, render: a => UI.planBadge(a.plan), csv: a => C.plans[a.plan].name },
        { key: 'mrr', label: 'درآمد ماهانه', num: true, render: a => a.mrr ? UI.compact(a.mrr) : '<span class="faint">—</span>', csv: a => a.mrr },
        { key: 'health', label: 'سلامت', num: true, render: a => UI.healthScore(a.health), csv: a => a.health },
        { key: 'trend', label: 'روند ۳۰ روز', nosort: true, sort: false, render: a => { const v = []; for (let d = 29; d >= 0; d--) v.push(a.ev[d]); return Charts.spark(v, { w: 76, h: 22, bars: true }); }, csv: a => a.events30 },
        { key: 'lastSeen', label: 'آخرین فعالیت', sort: a => -a.lastSeenMin, desc: true, render: a => UI.lastSeen(a), csv: a => a.lastSeenDays },
        { key: 'members', label: 'اعضای فعال', num: true, sort: a => a.activeMembers7, render: a => UI.n(a.activeMembers7) + '<span class="faint"> / ' + UI.n(a.memberCount) + '</span>', csv: a => a.activeMembers7 + '/' + a.memberCount },
        { key: 'signal', label: 'سیگنال', sort: a => (a.pastDue ? 100 : 0) + a.limitHits30 + a.pricingVisits30 * 2, desc: true, render: a => UI.signals(a), csv: a => (a.pastDue ? 'پرداخت ناموفق ' : '') + a.limitHits30 + ' سقف / ' + a.pricingVisits30 + ' قیمت' },
        { key: 'renew', label: 'تمدید', sort: a => a.paying ? -a.renewIn : -9999, desc: true, render: a => a.paying ? '<span class="nowrap">' + UI.date(-a.renewIn) + '</span><span class="s">' + UI.inDays(a.renewIn) + '</span>' : (a.churnedAt !== undefined ? '<span class="badge st-crit"><i class="dot"></i>لغو شده</span>' : '<span class="faint">—</span>'), csv: a => a.paying ? a.renewIn : '' },
        { key: 'owner', label: 'مسئول', sort: a => UI.ownerOf(a) || 'zz', render: a => UI.repName(UI.ownerOf(a), true), csv: a => { const o = UI.ownerOf(a); return o ? DB.rep(o).name : ''; } },
      ],
      bulk: [],
      bulkWire(el, sel, done) {
        const bar = el.querySelector('.bulkbar'); if (!bar) return;
        const s = document.createElement('span'); s.className = 'row'; s.style.gap = '6px';
        s.innerHTML = '<select class="select" style="height:27px;font-size:12px"><option value="">تعیین مسئول…</option>' + C.reps.map(r => '<option value="' + r.id + '">' + UI.esc(r.name) + '</option>').join('') + '<option value="__none">بدون مسئول</option></select>';
        bar.insertBefore(s, bar.querySelector('[data-unsel]'));
        s.querySelector('select').onchange = ev => {
          const v = ev.target.value; if (!v) return;
          const rows = sel();
          UI.setOwner(rows.map(a => a.id), v === '__none' ? null : v);
          UI.toast(UI.fa(rows.length) + ' مشتری به ' + (v === '__none' ? 'بدون مسئول' : DB.rep(v).name) + ' داده شد');
          done();
        };
      },
    });
  },
});
})();
</script>
</body>
</html>
