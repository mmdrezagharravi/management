<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعریف‌ها و دسترسی — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { accounts, agg, CONFIG: C } = DB;
const me = UI.me();

/* ------------------------------------------------------------ defaults */
const upRule = DB.segment('upsell').rule;
const ruleNum = (re, def) => { const m = upRule.match(re); return m ? +m[1] : def; };
const bandMin = k => C.health.bands.find(b => b.key === k).min;
const DEFAULTS = {
  actRecords: C.activation.records, actDays: C.activation.days,
  good: bandMin('good'), warn: bandMin('warn'), ser: bandMin('ser'),
  upHits: ruleNum(/limit_hits_30d\s*>=\s*(\d+)/, 2), upPricing: ruleNum(/pricing_visits_30d\s*>=\s*(\d+)/, 1), upSeen: ruleNum(/last_seen\s*<=\s*(\d+)/, 14),
};
const current = () => Object.assign({}, DEFAULTS, UI.store.get('thresholds', null) || {});
const canEdit = me.role === 'manager';

/* ------------------------------------------------------------- roles */
const PERMS = ['دیدن همهٔ مشتریان', 'دیدن شماره/ایمیل', 'خروجی CSV', 'تغییر مسئول', 'تغییر آستانه‌ها', 'دیدن درآمد'];
const ROLES = [
  { key: 'manager', label: 'مدیر فروش',     p: [1, 1, 1, 1, 1, 1] },
  { key: 'rep',     label: 'کارشناس فروش',  p: [0, 1, 0, 0, 0, 1] },
  { key: 'support', label: 'پشتیبانی',      p: [1, 1, 0, 0, 0, 0] },
  { key: 'product', label: 'محصول',         p: [1, 0, 1, 0, 0, 0] },
  { key: 'admin',   label: 'مدیر سیستم',    p: [1, 1, 1, 1, 1, 1] },
];

/* ------------------------------------------------------------- audit rows */
const tsOf = e => C.now + (e.min - C.nowMinutes) * 60000 - e.t * 864e5;
const fmtLocal = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Tehran' });
function auditRows() {
  const server = DB.audit.map((e, i) => ({ id: 's' + i, src: 'server', ts: tsOf(e), who: e.who, action: e.action, target: e.target != null ? DB.byId.get(e.target) : null,
    when: UI.esc(UI.agoDays(e.t)) + ' ' + UI.clock(e.min) }));
  const local = UI.store.get('audit', []).map((e, i) => ({ id: 'l' + i, src: 'local', ts: e.at, who: e.who, action: e.action, target: null,
    when: '<span title="' + UI.esc(fmtLocal.format(new Date(e.at))) + '">' + UI.esc(UI.ago(Math.max(0, (Date.now() - e.at) / 60000))) + '</span>' }));
  return local.concat(server).sort((p, q) => q.ts - p.ts);
}

const TABS = [
  { key: 'defs', label: 'تعریف معیارها' },
  { key: 'thresholds', label: 'آستانه‌ها' },
  { key: 'roles', label: 'نقش‌ها و دسترسی' },
  { key: 'audit', label: 'گزارش ممیزی' },
];

UI.page({
  id: 'settings', title: 'تعریف‌ها و دسترسی',
  sub: 'هر عدد پنل با همین تعریف‌ها حساب می‌شود — یک جا، برای همه',
  render(ctx) {
    const B = ctx.body;
    let tab = UI.param('tab'); if (!TABS.some(t => t.key === tab)) tab = 'defs';
    B.innerHTML = '<div class="tabs" role="tablist">' + TABS.map(t => '<button role="tab" data-tab="' + t.key + '" class="' + (t.key === tab ? 'on' : '') + '" aria-selected="' + (t.key === tab) + '">' + UI.esc(t.label) +
      (t.key === 'audit' ? '<span class="n">' + UI.fa(auditRows().length) + '</span>' : '') + '</button>').join('') + '</div><div id="tab" class="stack" style="gap:14px"></div>';
    const el = B.querySelector('#tab');
    B.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
      tab = b.dataset.tab; UI.setParam('tab', tab === 'defs' ? null : tab);
      B.querySelectorAll('[data-tab]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
      draw();
    });
    function draw() { ({ defs, thresholds, roles, audit })[tab](el); }
    draw();
  },
});

/* ============================================================ tab: definitions */
function defs(el) {
  const mrrNow = agg.mrrAt(0), payNow = agg.payingAt(0), mrrPrev = agg.mrrAt(30), payPrev = agg.payingAt(30);
  const mv = agg.movements(30, 0);
  const churnRate = mrrPrev ? -mv.churn / mrrPrev : 0;
  const nrr = mrrPrev ? (mrrPrev + mv.expansion + mv.contraction + mv.churn) / mrrPrev : 0;
  const active7 = agg.activeInWindow(0, C.activeWindow);
  const dormant = accounts.filter(a => a.lastSeenDays > C.dormantDays).length;
  const def = (name, text, val) => '<div class="li" style="align-items:flex-start"><span class="main"><span class="t">' + name + '</span><span class="d" style="white-space:normal">' + text + '</span></span>' + (val ? '<span class="end"><b>' + val + '</b><div class="muted" style="font-size:11px">امروز</div></span>' : '') + '</div>';
  const bands = C.health.bands.slice().sort((p, q) => q.min - p.min);
  const dist = agg.healthDist();
  const segs = agg.segmentCounts();
  const P = C.planOrder.map(k => C.plans[k]);
  const lim = (v, f) => v == null ? '<span class="muted">به تعداد خرید</span>' : v === 0 ? '<span class="faint">—</span>' : f ? f(v) : UI.n(v);
  const planRows = [
    ['قیمت ماهانه', p => p.price ? UI.money(p.price) : 'رایگان'],
    ['صندلی در قیمت', p => UI.n(p.seatsIncluded)],
    ['هر صندلی اضافه', p => p.seatPrice ? UI.money(p.seatPrice) : '<span class="faint">—</span>'],
    ['سقف صندلی', p => lim(p.limits.seats)],
    ['رکورد (کل حساب)', p => lim(p.limits.records)],
    ['اجرای اتوماسیون در ماه', p => lim(p.limits.runs)],
    ['پیامک در ماه', p => lim(p.limits.sms)],
    ['توکن هوش مصنوعی در ماه', p => lim(p.limits.ai, UI.compact)],
    ['فضای ذخیره', p => lim(p.limits.storage, v => UI.n(v) + ' گیگ')],
  ];
  const M = '<span class="ltr">MRR</span>';
  const cyc = Object.values(C.cycles).filter(c => c.discount).map(c => c.name + ' ' + UI.pct(c.discount)).join('، ');

  el.innerHTML =
    '<div class="grid g2">' +
      UI.card({ title: 'فعالیت و فعال‌سازی', flush: true, body: '<div class="list" style="padding:0 16px">' +
        def('حساب فعال', 'حسابی که در ' + UI.fa(C.activeWindow) + ' روز اخیر دست‌کم یک رویداد (ساخت یا ویرایش رکورد، اجرای اتوماسیون و…) داشته.', UI.n(active7)) +
        def('فعال‌سازی', 'ثبت‌نامی که در ' + UI.fa(C.activation.days) + ' روز اول به ' + UI.fa(C.activation.records) + ' رکورد رسیده. نرخ آن فقط برای کوهورت‌هایی که ۷ روزشان تمام شده حساب می‌شود.') +
        def('عادت', 'حساب فعال‌شده‌ای که در ' + UI.fa(C.habit.weeks) + ' هفته از ' + UI.fa(C.habit.of) + ' هفتهٔ اول کار کرده.') +
        def('حساب خاموش', 'بیش از ' + UI.fa(C.dormantDays) + ' روز هیچ فعالیتی نداشته.', UI.n(dormant)) +
        '</div>' }) +
      UI.card({ title: 'درآمد', flush: true, body: '<div class="list" style="padding:0 16px">' +
        def('MRR — درآمد ماهانهٔ تکرارشونده', 'جمع اشتراک‌های فعال به ماه. پرداخت سه‌ماهه و سالانه بر تعداد ماه تقسیم می‌شود (با تخفیف ' + UI.esc(cyc) + ').', UI.money(mrrNow)) +
        def('ARPA — میانگین درآمد هر حساب', M + ' تقسیم بر تعداد حساب‌های پرداخت‌کننده (' + UI.n(payNow) + ').', UI.money(payNow ? mrrNow / payNow : 0)) +
        def('ریزش درآمد', M + ' اشتراک‌های لغوشده در ۳۰ روز، تقسیم بر ' + M + ' سی روز پیش. ریزش حساب: ' + UI.n(mv.churnCount) + ' از ' + UI.n(payPrev) + ' حساب.', UI.pct(churnRate, 1)) +
        def('NRR — نگهداشت خالص درآمد', '(' + M + ' سی روز پیش + افزایش − کاهش − ریزش) تقسیم بر ' + M + ' سی روز پیش. مشتریان جدید حساب نمی‌شوند؛ بالای ۱۰۰٪ یعنی مشتریان فعلی به‌تنهایی رشد می‌دهند.', UI.pct(nrr, 1)) +
        '</div>' }) +
    '</div>' +
    '<div class="grid g2">' +
      UI.card({ title: 'امتیاز سلامت', hint: 'پنج مؤلفه × ۲۰ = ۰ تا ۱۰۰', flush: true, body:
        '<div class="list" style="padding:0 16px">' + C.health.components.map(c => def(UI.esc(c.label) + ' <span class="faint" style="font-weight:400">· ۰ تا ۲۰</span>', UI.esc(c.desc))).join('') + '</div>' +
        '<div style="padding:4px 16px 14px"><div class="section-title" style="margin:6px 0 8px">باندها <span class="faint" style="font-weight:400">— تعداد مشتریان پرداخت‌کننده</span></div><div class="stack" style="gap:6px">' +
        bands.map((b, i) => { const hi = i ? bands[i - 1].min - 1 : 100; const d = dist.find(x => x.key === b.key);
          return '<div class="row between">' + UI.statusBadge(b.key, b.label) + '<span class="muted" style="font-size:12px">' + UI.fa(b.min) + ' تا ' + UI.fa(hi) + '</span><b style="min-width:48px;text-align:left">' + UI.n(d ? d.n : 0) + '</b></div>'; }).join('') +
        '</div></div>',
        foot: '<span>آستانهٔ باندها را در زبانهٔ «آستانه‌ها» می‌توانید تغییر دهید</span><a href="health.html">سلامت و ریسک</a>' }) +
      UI.card({ title: 'سقف پلن‌ها', hint: 'از پیکربندی پلن', flush: true, body:
        '<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th></th>' + P.map(p => '<th class="num">' + UI.planBadge(p.key) + '</th>').join('') + '</tr></thead><tbody>' +
        planRows.map(([l, f]) => '<tr><td class="nowrap muted">' + l + '</td>' + P.map(p => '<td class="num">' + f(p) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>',
        foot: '<span>رکورد و فضا تجمعی است؛ اجرا، پیامک و توکن هر ماه صفر می‌شود</span><a href="quota.html">مصرف و سهمیه</a>' }) +
    '</div>' +
    UI.card({ title: 'دسته‌بندی‌ها', hint: 'هر حساب می‌تواند در چند دسته باشد', flush: true, body:
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>دسته</th><th class="num">حساب امروز</th><th>قانون</th><th>یعنی</th></tr></thead><tbody>' +
      segs.map(s => '<tr><td class="nowrap"><b>' + UI.esc(s.label) + '</b></td><td class="num"><b>' + UI.n(s.n) + '</b></td><td><span class="mono" style="font-size:11.5px">' + UI.esc(s.rule) + '</span></td><td class="muted">' + UI.esc(s.desc) + '</td></tr>').join('') +
      '</tbody></table></div>',
      foot: '<span>قانون‌ها همان‌طور که در موتور محاسبه نوشته شده‌اند</span><a href="segments.html">دسته‌بندی‌ها</a>' });
}

/* ============================================================ tab: thresholds */
function thresholds(el) {
  const cur = current(), saved = !!UI.store.get('thresholds', null);
  const field = (k, label, min, max) => '<label class="field">' + label +
    '<input class="input" type="number" inputmode="numeric" data-k="' + k + '" min="' + min + '" max="' + max + '" value="' + cur[k] + '"' + (canEdit ? '' : ' disabled') + ' style="max-width:140px">' +
    '<span class="faint" style="font-weight:400">پیش‌فرض: ' + UI.fa(DEFAULTS[k]) + (cur[k] !== DEFAULTS[k] ? ' · <b style="color:var(--accent-ink)">تغییر کرده</b>' : '') + '</span></label>';
  el.innerHTML =
    (canEdit ? '' : '<div class="banner info">' + UI.icon('lock') + '<div>فقط مدیر فروش و مدیر سیستم می‌توانند آستانه‌ها را تغییر دهند. مقدارهای فعلی را می‌بینید.</div></div>') +
    '<div class="grid g3">' +
      UI.card({ title: 'فعال‌سازی', hint: 'برای ثبت‌نام‌های جدید', body: '<div class="stack" style="gap:12px">' + field('actRecords', 'حداقل رکورد', 1, 10000) + field('actDays', 'در چند روز اول', 1, 30) + '</div>' }) +
      UI.card({ title: 'باندهای سلامت', hint: 'حداقل امتیاز هر باند', body: '<div class="stack" style="gap:12px">' +
        field('good', C.health.bands.find(b => b.key === 'good').label + ' از', 1, 100) + field('warn', C.health.bands.find(b => b.key === 'warn').label + ' از', 1, 100) + field('ser', C.health.bands.find(b => b.key === 'ser').label + ' از', 1, 100) +
        '<span class="note">کمتر از آخرین عدد = ' + UI.esc(C.health.bands.find(b => b.key === 'crit').label) + '</span></div>' }) +
      UI.card({ title: 'آمادهٔ ارتقا', hint: 'پلن رایگان و پایه', body: '<div class="stack" style="gap:12px">' + field('upHits', 'برخورد با سقف در ۳۰ روز (حداقل)', 1, 40) + field('upPricing', 'بازدید صفحهٔ قیمت در ۳۰ روز (حداقل)', 0, 20) + field('upSeen', 'آخرین فعالیت (حداکثر روز)', 1, 90) + '</div>' }) +
    '</div>' +
    UI.card({ title: 'اثر روی امروز', hint: 'با عددهای بالا — پیش از ذخیره', body: '<div id="pv"></div>',
      foot: '<span class="row wrap" style="gap:8px">' + (canEdit ? '<button class="btn primary" id="save">' + UI.icon('check') + 'ذخیره</button><button class="btn ghost" id="reset"' + (saved ? '' : ' disabled') + '>بازگشت به پیش‌فرض</button>' : '') +
        '</span><span>' + (saved ? 'مقدارهای ذخیره‌شده در این مرورگر' : 'مقدارهای پیش‌فرض سیستم') + '</span>' });

  const read = () => { const o = {}; el.querySelectorAll('[data-k]').forEach(i => { o[i.dataset.k] = Math.round(+i.value); }); return o; };
  const paying = accounts.filter(a => a.paying);
  function preview() {
    const v = read();
    const upN = accounts.filter(a => (a.plan === 'free' || a.plan === 'basic') && a.limitHits30 >= v.upHits && a.pricingVisits30 >= v.upPricing && a.lastSeenDays <= v.upSeen).length;
    const upD = accounts.filter(a => a.segments.includes('upsell')).length;
    const bandN = k => paying.filter(a => k === 'good' ? a.health >= v.good : k === 'warn' ? a.health >= v.warn && a.health < v.good : k === 'ser' ? a.health >= v.ser && a.health < v.warn : a.health < v.ser).length;
    const bandD = k => paying.filter(a => a.band.key === k).length;
    const cell = (label, n, d) => '<div style="border:1px solid var(--border);border-radius:9px;padding:9px 12px;min-width:0"><div class="muted" style="font-size:11.5px;font-weight:600">' + label + '</div><div style="font-weight:800;font-size:19px">' + UI.n(n) + '</div><div style="font-size:11.5px">' + (n === d ? '<span class="faint">بدون تغییر</span>' : '<b style="color:var(--accent-ink)">' + (n > d ? '+' : '−') + UI.n(Math.abs(n - d)) + '</b> <span class="faint">نسبت به ' + UI.n(d) + ' امروز</span>') + '</div></div>';
    el.querySelector('#pv').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px">' +
      cell('آمادهٔ ارتقا', upN, upD) + C.health.bands.map(b => cell('پرداخت‌کنندهٔ ' + b.label, bandN(b.key), bandD(b.key))).join('') + '</div>' +
      '<div class="note" style="margin-top:8px">فعال‌سازی فقط روی ثبت‌نام‌های بعد از ذخیره اثر دارد، برای همین پیش‌نمایش ندارد.</div>';
  }
  el.querySelectorAll('[data-k]').forEach(i => i.addEventListener('input', preview));
  preview();
  if (!canEdit) return;
  el.querySelector('#save').onclick = () => {
    const v = read();
    const bad = Object.entries(v).find(([k, x]) => isNaN(x) || x < 0);
    if (bad) return UI.toast('عدد نامعتبر است');
    if (!(v.good <= 100 && v.good > v.warn && v.warn > v.ser && v.ser > 0)) return UI.toast('باندها باید نزولی باشند: سالم > نیاز به توجه > در خطر > ۰');
    if (v.actRecords < 1 || v.actDays < 1 || v.actDays > 30) return UI.toast('فعال‌سازی: حداقل ۱ رکورد و بین ۱ تا ۳۰ روز');
    const changed = Object.keys(v).filter(k => v[k] !== DEFAULTS[k]);
    UI.store.set('thresholds', v);
    UI.logAudit('تغییر آستانه‌ها' + (changed.length ? ' (' + UI.fa(changed.length) + ' مقدار متفاوت با پیش‌فرض)' : ''));
    UI.toast('ذخیره شد — در نسخهٔ واقعی روی سرور اعمال می‌شود');
    thresholds(el);
  };
  el.querySelector('#reset').onclick = () => {
    const prev = UI.store.get('thresholds', null);
    UI.store.set('thresholds', null);
    UI.logAudit('بازگشت آستانه‌ها به پیش‌فرض');
    thresholds(el);
    UI.toast('آستانه‌ها به پیش‌فرض برگشت', () => { UI.store.set('thresholds', prev); thresholds(el); });
  };
}

/* ============================================================ tab: roles */
function roles(el) {
  const mine = me.role === 'rep' ? 'rep' : 'manager';
  el.innerHTML = UI.card({ title: 'نقش‌ها و دسترسی', hint: 'نقش شما: ' + UI.esc(ROLES.find(r => r.key === mine).label), flush: true,
    body: '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>نقش</th>' + PERMS.map(p => '<th style="text-align:center">' + UI.esc(p) + '</th>').join('') + '</tr></thead><tbody>' +
      ROLES.map(r => '<tr' + (r.key === mine ? ' class="sel"' : '') + '><td class="nowrap"><b>' + UI.esc(r.label) + '</b>' + (r.key === mine ? ' <span class="tag">شما</span>' : '') + '</td>' +
        r.p.map(x => '<td style="text-align:center">' + (x ? '<b style="color:var(--good-ink)" aria-label="دارد">✓</b>' : '<span class="faint" aria-label="ندارد">—</span>') + '</td>').join('') + '</tr>').join('') +
      '</tbody></table></div>',
    foot: '<span>کارشناس فروش فقط مشتریانی را می‌بیند که مسئولشان است</span><a href="settings.html?tab=audit" data-go="audit">گزارش ممیزی</a>' }) +
    '<div class="banner info">' + UI.icon('lock') + '<div><b>شماره و ایمیل مشتری پیش‌فرض پوشیده است.</b> هر بار که کسی آن را باز می‌کند یا خروجی CSV می‌گیرد، با نام، زمان و حساب در «گزارش ممیزی» ثبت می‌شود.</div></div>';
  const go = el.querySelector('[data-go]');
  go.onclick = ev => { ev.preventDefault(); document.querySelector('[data-tab="audit"]').click(); };
}

/* ============================================================ tab: audit */
function audit(el) {
  const rows = auditRows();
  const localN = rows.filter(r => r.src === 'local').length;
  el.innerHTML = '<div class="card" id="au"></div><div class="note">«این مرورگر» یعنی کارهایی که همین‌جا انجام داده‌اید (نمایش شماره، خروجی، تغییر مسئول، تغییر آستانه) — ' + UI.n(localN) + ' مورد. در نسخهٔ واقعی همه روی سرور ثبت می‌شوند.</div>';
  UI.table(el.querySelector('#au'), {
    rows, exportName: 'audit', unit: 'رویداد', pageSize: 25,
    sort: { key: 'ts', dir: 'desc' },
    search: { placeholder: 'کار، شخص یا حساب…', text: r => r.action + ' ' + r.who + ' ' + (r.target ? r.target.name : '') },
    filters: [
      { key: 'src', label: 'منبع', options: [{ v: 'server', l: 'سرور' }, { v: 'local', l: 'این مرورگر' }], test: (r, v) => r.src === v },
      { key: 'who', label: 'شخص', options: [...new Set(rows.map(r => r.who))].map(w => ({ v: w, l: w })), test: (r, v) => r.who === v },
    ],
    onRow: r => { if (r.target) UI.openAccount(r.target.id); },
    columns: [
      { key: 'ts', label: 'زمان', desc: true, render: r => '<span class="nowrap">' + r.when + '</span>', csv: r => new Date(r.ts).toISOString() },
      { key: 'who', label: 'چه کسی', render: r => '<span class="row" style="gap:7px"><span class="avatar">' + UI.esc(UI.initials(r.who)) + '</span><b class="nowrap">' + UI.esc(r.who) + '</b></span>', csv: r => r.who },
      { key: 'action', label: 'کار', render: r => UI.esc(r.action) },
      { key: 'target', label: 'حساب', sort: r => r.target ? r.target.name : '', render: r => r.target ? '<a href="' + UI.custLink(r.target) + '" data-acc="' + r.target.id + '" style="font-weight:600">' + UI.esc(r.target.name) + '</a>' : '<span class="faint">—</span>', csv: r => r.target ? r.target.name : '' },
      { key: 'src', label: 'منبع', render: r => r.src === 'local' ? '<span class="tag">این مرورگر</span>' : '<span class="muted">سرور</span>', csv: r => r.src === 'local' ? 'این مرورگر' : 'سرور' },
    ],
  });
}
})();
</script>
</body>
</html>
