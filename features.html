<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استفاده از قابلیت‌ها — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
<style>#t-feat table.tbl { min-width: 620px; }</style>
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { agg, accounts, CONFIG: C } = DB;
const txt = s => '<span style="font-size:19px">' + UI.esc(s) + '</span>';
const median = arr => { const v = arr.slice().sort((p, q) => p - q); return v.length ? (v[(v.length - 1) >> 1] + v[v.length >> 1]) / 2 : 0; };

UI.page({
  id: 'features', title: 'استفاده از قابلیت‌ها', range: true, sources: ['behavior'],
  sub: 'مشتری‌ها از چه چیزی استفاده می‌کنند و کدام قابلیت آن‌ها را نگه می‌دارد',
  render(ctx) {
    const R = ctx.range, B = ctx.body;
    const F = agg.features(0, R);
    const active = accounts.filter(a => DB.countRange(a.ev, 0, R) > 0);
    const prevActive = accounts.filter(a => DB.countRange(a.ev, R, 2 * R) > 0);
    const activePrev = prevActive.length;
    // Adoption = share of active accounts that have used the feature (by the end of the window).
    // agg.features measures "now" as last-use-inside-the-window but "before" as adopted-by-then, so its
    // change column shows false drops on short ranges; both periods are recomputed here with one rule.
    const uses = (a, k) => !!a.feat[k];
    const pay = active.filter(a => a.paying), free = active.filter(a => !a.paying);
    F.forEach((f, i) => {
      f.users = active.filter(a => uses(a, f.key)).length;
      f.rate = active.length ? f.users / active.length : 0;
      f.prevRate = prevActive.length ? prevActive.filter(a => a.feat[f.key] && a.feat[f.key].first >= R).length / prevActive.length : 0;
      f.id = i; f.ch = f.rate - f.prevRate;
      f.pay = pay.length ? pay.filter(a => uses(a, f.key)).length / pay.length : 0;
      f.free = free.length ? free.filter(a => uses(a, f.key)).length / free.length : 0;
      f.gated = !accounts.some(a => !a.everPaid && a.feat[f.key]);   // never used by an account that never paid → paid-plan feature
    });
    const byKey = k => F.find(f => f.key === k);
    const keyF = F.filter(f => f.key_feature);
    const top = keyF.slice().sort((p, q) => q.rate - p.rate)[0];
    const grow = F.slice().sort((p, q) => q.ch - p.ch)[0];
    const au = byKey('automation'), ai = byKey('ai');

    // ---------------------------------------------------------------- KPIs
    let h = '<div class="kpis">' +
      UI.kpi({ label: 'حساب فعال در ' + UI.fa(R) + ' روز', value: UI.n(active.length), info: 'حسابی که در بازه دست‌کم یک رویداد داشته', delta: UI.delta(active.length, activePrev), cmp: 'قبل: ' + UI.n(activePrev) }) +
      UI.kpi({ label: 'پرکاربردترین قابلیت کلیدی', value: txt(top.label), cmp: '<b style="color:var(--ink)">' + UI.pct(top.rate) + '</b> از حساب‌های فعال' }) +
      UI.kpi({ label: 'بیشترین رشد', value: txt(grow.label), info: 'بیشترین افزایش نفوذ نسبت به بازهٔ هم‌طول قبلی', delta: UI.delta(grow.rate, grow.prevRate, { points: true }), cmp: 'اکنون ' + UI.pct(grow.rate) }) +
      UI.kpi({ label: 'اتوماسیون', value: UI.pct(au.rate), delta: UI.delta(au.rate, au.prevRate, { points: true }), cmp: UI.n(au.users) + ' حساب' }) +
      UI.kpi({ label: 'هوش مصنوعی', value: UI.pct(ai.rate), delta: UI.delta(ai.rate, ai.prevRate, { points: true }), cmp: UI.n(ai.users) + ' حساب' }) +
      '</div>';

    // ------------------------------------------------ retention impact
    const imp = keyF.map(f => {
      const ad = agg.retentionCurve(a => !!a.feat[f.key], 12);
      const no = agg.retentionCurve(a => !!a.feat.tables && !a.feat[f.key], 12);   // base builders who never used it
      return { f, ad: ad[12], adN: ad.n, no: no[12], noN: no.n, lift: no[12] ? ad[12] / no[12] : 0 };
    }).sort((p, q) => q.lift - p.lift);
    const medLift = median(imp.map(x => x.lift)), medRate = median(imp.map(x => x.f.rate));
    const opp = imp.filter(x => x.lift >= medLift && x.f.rate <= medRate);
    const oppOpen = opp.filter(x => !x.f.gated), oppPaid = opp.filter(x => x.f.gated);
    const names = list => list.map(x => '«' + UI.esc(x.f.label) + '»').join('، ');
    const range = list => { const l = list.map(x => x.lift); return UI.n(Math.min(...l), 1) + (l.length > 1 ? ' تا ' + UI.n(Math.max(...l), 1) : ''); };
    const oppText = opp.length ? '<b>' + names(opp) + ':</b> کاربرانشان در هفتهٔ ۱۲ ' + range(opp) + ' برابر بیشتر می‌مانند، ولی هر کدام کمتر از ' + UI.pct(medRate) + ' حساب‌های فعال را پوشش می‌دهند. ' +
      (oppOpen.length ? 'ساخت ' + names(oppOpen) + ' را به قدم‌های آنبوردینگ اضافه کنید. ' : '') +
      (oppPaid.length ? (oppPaid.length === opp.length ? 'همه' : names(oppPaid)) + ' فقط در پلن‌های پولی باز است: به پرداخت‌کننده‌هایی که هنوز سراغشان نرفته‌اند آموزش دهید و در دموی فروش نشانشان دهید.' : '') : '';

    const impTbl = '<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>قابلیت</th><th class="num">کاربران</th><th class="num">غیرکاربران</th><th class="num">ضریب</th><th class="num">نفوذ فعلی</th></tr></thead><tbody>' +
      imp.map(x => '<tr><td class="nowrap"><b>' + UI.esc(x.f.label) + '</b>' + (opp.includes(x) ? ' <span class="badge st-info" style="height:19px">فرصت</span>' : '') + '</td>' +
        '<td class="num"><b>' + UI.pct(x.ad) + '</b><span class="s">' + UI.n(x.adN) + ' حساب</span></td><td class="num">' + UI.pct(x.no) + '<span class="s">' + UI.n(x.noN) + ' حساب</span></td>' +
        '<td class="num"><b>' + UI.n(x.lift, 1) + ' برابر</b></td><td class="num">' + UI.pct(x.f.rate) + '</td></tr>').join('') + '</tbody></table></div>';

    // active pro/enterprise customers (every feature is open to them) who have not touched a sticky feature yet
    const top2 = pay.filter(a => a.plan === 'pro' || a.plan === 'ent');
    const gaps = opp.length ? '<div class="section-title" style="margin:16px 0 2px">پرو و سازمانیِ فعالی که هنوز سراغش نرفته‌اند — آموزش دهید</div><div class="list">' +
      opp.map(x => { const n = top2.filter(a => !a.feat[x.f.key]).length; return '<a class="li" href="customers.html?view=paying&plan=pro"><span class="main"><span class="t">' + UI.esc(x.f.label) + '</span><span class="d">کاربرانش ' + UI.n(x.lift, 1) + ' برابر بیشتر می‌مانند</span></span><span class="end"><b>' + UI.n(n) + '</b> <span class="muted">از ' + UI.n(top2.length) + '</span></span></a>'; }).join('') + '</div>' : '';

    // ------------------------------------------------------------ layout
    h += '<div class="grid g-main">' +
      UI.card({ title: 'نفوذ قابلیت‌ها', hint: 'سهم حساب‌های فعال در ' + UI.fa(R) + ' روز', flush: true, body: '<div id="t-feat"></div>',
        foot: '<span>«تغییر» به واحد درصد، نسبت به ' + UI.fa(R) + ' روز قبل</span><a href="segments.html">دسته‌بندی‌ها</a>' }) +
      UI.card({ title: 'نفوذ به تفکیک پلن', hint: 'سهم حساب‌های فعالِ هر پلن', body: '<div class="tbl-wrap"><div id="c-plan" style="min-width:340px"></div></div>' + gaps,
        foot: '<span>خانهٔ کم‌رنگ در پلن پولی = فرصت آموزش</span><a href="customers.html">همهٔ مشتریان</a>' }) +
      '</div>';
    h += UI.card({ title: 'کدام قابلیت مشتری را نگه می‌دارد؟', hint: 'نگهداشت هفتهٔ ۱۲ · کاربران در برابر غیرکاربران',
      body: (oppText ? '<div class="banner info" style="margin-bottom:14px">' + UI.icon('target') + '<div>' + oppText + '</div></div>' : '') +
        '<div class="grid g2" style="gap:24px"><div><div class="section-title" style="margin-bottom:8px">ضریب ماندن (کاربران ÷ غیرکاربران)</div><div id="c-lift"></div>' +
        '<div class="legend" style="margin-top:8px"><span class="k"><i class="sw" style="background:var(--series-1)"></i>اثر زیاد، نفوذ کم — فرصت</span><span class="k"><i class="sw" style="background:var(--deemph)"></i>سایر قابلیت‌های کلیدی</span></div></div><div>' + impTbl + '</div></div>',
      foot: '<span>غیرکاربران = حساب‌هایی که بیس ساخته‌اند ولی از آن قابلیت استفاده نکرده‌اند؛ همبستگی است، نه اثبات علت</span><a href="onboarding.html">ثبت‌نام‌های تازه</a>' });
    B.innerHTML = h;

    UI.table(B.querySelector('#t-feat'), {
      rows: F, exportName: 'features', unit: 'قابلیت', pageSizes: false, compact: true, sort: { key: 'rate', dir: 'desc' },
      columns: [
        { key: 'label', label: 'قابلیت', render: f => '<span class="nm">' + UI.esc(f.label) + '</span><span class="s">' + (f.key_feature ? 'کلیدی' : 'پایه') + (f.gated ? ' · فقط پلن پولی' : '') + '</span>', csv: f => f.label },
        { key: 'users', label: 'حساب', num: true, render: f => UI.n(f.users) },
        { key: 'rate', label: 'نفوذ', num: true, render: f => '<div class="hb"><span class="tr"><i style="width:' + (f.rate * 100).toFixed(1) + '%"></i></span><b>' + UI.pct(f.rate) + '</b></div>', csv: f => (f.rate * 100).toFixed(1) },
        { key: 'ch', label: 'تغییر', num: true, render: f => UI.delta(f.rate, f.prevRate, { points: true }), csv: f => (f.ch * 100).toFixed(1) },
        { key: 'pay', label: 'پرداخت‌کننده', num: true, render: f => UI.pct(f.pay), csv: f => (f.pay * 100).toFixed(1) },
        { key: 'free', label: 'رایگان', num: true, render: f => f.gated ? '<span class="faint">—</span>' : UI.pct(f.free), csv: f => (f.free * 100).toFixed(1) },
      ],
    });

    const plans = C.planOrder.map(k => ({ k, list: active.filter(a => a.plan === k) }));
    Charts.heat(B.querySelector('#c-plan'), {
      rowHead: 'قابلیت', tipLabel: 'نفوذ', domain: [0, 1],
      cols: plans.map(p => C.plans[p.k].name + ' (' + UI.n(p.list.length) + ')'),
      rows: F.slice().sort((p, q) => q.rate - p.rate).map(f => ({ label: f.label, cells: plans.map(p => p.list.length ? p.list.filter(a => uses(a, f.key)).length / p.list.length : null),
        tips: plans.map(p => UI.n(p.list.filter(a => uses(a, f.key)).length) + ' از ' + UI.n(p.list.length) + ' حساب') })),
    });

    Charts.hbars(B.querySelector('#c-lift'), { labelWidth: 100, format: v => UI.n(v, 1) + ' برابر', valueWidth: 70,
      items: imp.map(x => ({ label: x.f.label, sub: UI.pct(x.ad) + ' در برابر ' + UI.pct(x.no), value: x.lift, color: opp.includes(x) ? 'var(--series-1)' : 'var(--deemph)' })) });
  },
});
})();
</script>
</body>
</html>
