<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پروفایل مشتری — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { accounts, CONFIG: C } = DB;
// default: the paying customer with the most revenue at risk — the one a manager would open first
const fallback = accounts.filter(a => a.paying && a.health < 50).sort((p, q) => q.mrr - p.mrr)[0];
const a = DB.byId.get(+UI.param('id')) || fallback;
let tab = UI.param('tab') || 'summary';

const ACTIONS = {
  activity: 'تماس بگیرید و دلیل کاهش استفاده را بپرسید — معمولاً تغییر فرد مسئول یا فرایند است.',
  trend: 'فعالیت دو هفتهٔ اخیر افت کرده؛ بپرسید چه چیزی در تیم یا کارشان تغییر کرده.',
  depth: 'فقط جدول‌ها را استفاده می‌کنند؛ یک جلسهٔ ۲۰ دقیقه‌ای برای اتوماسیون و فرم پیشنهاد دهید.',
  team: 'بیشتر اعضا وارد نمی‌شوند؛ با مدیر حساب برای فعال کردن تیم هماهنگ کنید.',
  commercial: 'مشکل پرداخت، تیکت باز یا برخورد مکرر با سقف دارد؛ اول همین را حل کنید.',
};

UI.page({
  id: 'customer', nav: 'customers', sources: ['main', 'behavior', 'wallet'], noBanner: true,
  title: a.name,
  crumbs: '<a href="customers.html">مشتریان</a> ›' + (UI.param('id') ? '' : ' <span class="faint">نمونه: بیشترین درآمد در خطر</span>'),
  sub: UI.planBadge(a.plan) + ' · ' + UI.esc(a.industryName) + ' · ' + UI.esc(a.city) + ' · عضو از ' + UI.date(a.age, { year: true }) + ' (' + UI.esc(DB.source(a.source).name) + ')',
  actions: () => '<select class="select" id="own" aria-label="مسئول"><option value="">بدون مسئول</option>' + C.reps.map(r => '<option value="' + r.id + '"' + (r.id === UI.ownerOf(a) ? ' selected' : '') + '>مسئول: ' + UI.esc(r.name) + '</option>').join('') + '</select>' +
    '<button class="btn" id="nt">' + UI.icon('note') + 'یادداشت</button><button class="btn primary" id="cl">' + UI.icon('phone') + 'ثبت تماس</button>',
  render(ctx) {
    const paidTotal = a.invoices.filter(i => i.status === 'paid').reduce((s, i) => s + i.amount, 0);
    const hist = a.healthHistory.filter(x => x != null);
    const weakest = C.health.components.slice().sort((p, q) => a.components[p.key] - a.components[q.key])[0];
    const interactions = DB.activities.filter(x => x.accountId === a.id);
    const ns = UI.notes(a.id);

    let h = '';
    if (a.pastDue) h += '<div class="banner crit">' + UI.icon('card') + '<div><b>پرداخت تمدید ناموفق.</b> آخرین فاکتور ' + UI.fa(a.invoices[a.invoices.length - 1].retries) + ' بار تلاش شده و اشتراک در دورهٔ مهلت است — پیش از هر کار دیگر پیگیری کنید.</div></div>';
    if (a.churnedAt !== undefined) h += '<div class="banner">' + UI.icon('alert') + '<div><b>این مشتری ' + UI.agoDays(a.churnedAt) + ' اشتراکش را لغو کرد</b> (' + UI.esc(a.churnReason) + '). اگر کمتر از ۱۲۰ روز گذشته، در فهرست «بازگرداندنی» میز فروش است.</div></div>';

    h += '<div class="kpis">' +
      UI.kpi({ label: 'درآمد ماهانه', value: a.mrr ? UI.compactParts(a.mrr).num : '—', unit: a.mrr ? UI.compactParts(a.mrr).unit + ' ' + C.currency : '', cmp: a.paying ? 'پلن ' + C.plans[a.plan].name + ' · ' + C.cycles[a.cycle].name + (a.plan !== 'basic' ? ' · ' + UI.fa(a.seats) + ' صندلی' : '') : 'پلن رایگان' }) +
      UI.kpi({ label: 'امتیاز سلامت', value: UI.n(a.health), unit: a.band.label, delta: a.health2wAgo != null ? UI.delta(a.health, a.health2wAgo, { abs: true }) : '', cmp: 'نسبت به دو هفته پیش', spark: Charts.spark(hist, { color: 'var(--ink-2)' }) }) +
      UI.kpi({ label: 'آخرین فعالیت', value: a.online ? '<span class="live" style="font-size:20px"><i></i>آنلاین</span>' : UI.esc(UI.ago(a.lastSeenMin)), cmp: UI.fa(a.activeDays28) + ' روز فعال از ۲۸ روز' }) +
      UI.kpi({ label: 'اعضای فعال این هفته', value: UI.n(a.activeMembers7), unit: 'از ' + UI.n(a.memberCount), cmp: a.paying && a.plan !== 'basic' ? (a.memberCount >= a.seats ? '<b style="color:var(--warn-ink)">همهٔ ' + UI.fa(a.seats) + ' صندلی پر است</b>' : UI.fa(a.seats - a.memberCount) + ' صندلی خالی') : 'سقف پلن: ' + UI.fa(C.plans[a.plan].limits.seats) + ' نفر' }) +
      (a.paying ? UI.kpi({ label: 'تمدید بعدی', value: UI.inDays(a.renewIn), cmp: UI.date(-a.renewIn, { year: true }) + (a.renewIn <= 14 && a.health < 60 ? ' · <b style="color:var(--crit-ink)">در خطر</b>' : '') })
        : UI.kpi({ label: 'ارزش ارتقا', value: '+' + UI.compact(DB.upgradeValue(a)), unit: 'در ماه', cmp: a.segments.includes('upsell') ? '<b style="color:var(--accent-ink)">آمادهٔ ارتقا</b>' : 'بدون سیگنال خرید' })) +
      UI.kpi({ label: 'جمع پرداخت‌ها', value: paidTotal ? UI.compactParts(paidTotal).num : '—', unit: paidTotal ? UI.compactParts(paidTotal).unit + ' ' + C.currency : '', cmp: UI.fa(a.invoices.filter(i => i.status === 'paid').length) + ' فاکتور · مشتری ' + (a.tenureDays ? UI.fa(Math.round(a.tenureDays / 30)) + ' ماه' : '—') }) +
      '</div>';

    const tabs = [['summary', 'خلاصه'], ['activity', 'فعالیت'], ['members', 'اعضا', a.memberCount], ['bases', 'بیس‌ها', a.bases.length], ['billing', 'مالی', a.invoices.length], ['log', 'تعامل‌ها', interactions.length + ns.length]];
    h += '<div class="card"><div class="tabs" style="padding:0 12px" role="tablist">' + tabs.map(([k, l, n]) => '<button role="tab" data-tab="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + l + (n != null ? ' <span class="n">' + UI.fa(n) + '</span>' : '') + '</button>').join('') + '</div></div><div id="tabbody" class="stack"></div>';
    ctx.body.innerHTML = h;
    ctx.body.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; UI.setParam('tab', tab === 'summary' ? null : tab); ctx.rerender(); });
    const T = ctx.body.querySelector('#tabbody');

    if (tab === 'summary') {
      const comps = C.health.components.map(c => '<div class="comp" title="' + UI.esc(c.desc) + '"><span>' + UI.esc(c.label) + '</span><span class="tr"><i style="width:' + (a.components[c.key] / 20 * 100) + '%;' + (c.key === weakest.key ? 'background:var(--serious)' : '') + '"></i></span><b>' + UI.n(a.components[c.key]) + '</b></div>').join('');
      const tl = timeline();
      T.innerHTML = '<div class="grid g-main">' +
        '<div class="stack">' +
          UI.card({ title: 'فعالیت ۹۰ روز', hint: 'ویرایش در روز', body: '<div id="c-act"></div><div class="row wrap" style="gap:18px;margin-top:10px;font-size:12px"><span><span class="muted">رکورد ساخته‌شده در ۳۰ روز:</span> <b>' + UI.n(a.records30) + '</b></span><span><span class="muted">روند ۱۴ روزه:</span> ' + (a.trendPct ? UI.delta(100 + a.trendPct, 100) : '<b>بدون تغییر</b>') + '</span><span><span class="muted">اعضای فعال امروز:</span> <b>' + UI.n(a.au[0]) + '</b></span></div>' }) +
          UI.card({ title: 'مسیر این مشتری', hint: 'از اولین بازدید تا امروز', body: '<div class="tl">' + tl + '</div>' }) +
        '</div>' +
        '<div class="stack">' +
          UI.card({ title: 'چرا امتیاز سلامت ' + UI.fa(a.health) + ' است؟', hint: a.band.label, body: comps + '<div class="banner info" style="margin-top:12px">' + UI.icon('target') + '<div><b>قدم بعدی:</b> ' + UI.esc(ACTIONS[weakest.key]) + '</div></div>' }) +
          UI.card({ title: 'سیگنال‌ها', body: '<div class="kv"><span class="k">برخورد با سقف پلن (۳۰ روز)</span><span class="v">' + (a.limitHits30 ? '<span class="sig limit">' + UI.fa(a.limitHits30) + ' بار · ' + UI.esc(a.maxUsage.label) + '</span>' : '—') + '</span></div>' +
            '<div class="kv"><span class="k">بازدید صفحهٔ قیمت (۳۰ روز)</span><span class="v">' + (a.pricingVisits30 ? '<span class="sig price">' + UI.fa(a.pricingVisits30) + ' بار</span>' : '—') + '</span></div>' +
            '<div class="kv"><span class="k">تیکت پشتیبانی باز</span><span class="v">' + (a.tickets ? '<span class="sig due">' + UI.fa(a.tickets) + '</span>' : '—') + '</span></div>' +
            '<div class="kv"><span class="k">آخرین نظرسنجی NPS</span><span class="v">' + (a.nps != null ? UI.fa(a.nps) + ' از ۱۰ ' + (a.nps >= 9 ? UI.statusBadge('good', 'مروج') : a.nps >= 7 ? UI.statusBadge('warn', 'خنثی') : UI.statusBadge('crit', 'منتقد')) : '<span class="faint">پاسخ نداده</span>') + '</span></div>' +
            '<div class="kv"><span class="k">دسته‌ها</span><span class="v">' + (a.segments.length ? a.segments.map(k => '<a class="tag" href="segments.html?seg=' + k + '">' + UI.esc(DB.segment(k).label) + '</a>').join(' ') : '—') + '</span></div>' }) +
          UI.card({ title: 'مصرف پلن', hint: 'پلن ' + C.plans[a.plan].name, body: '<div class="stack" style="gap:10px">' + a.usage.filter(u => u.limit).map(u => UI.meter(u.label, u.used, u.limit, u.key === 'storage' ? { fmt: v => UI.n(v, 1) } : null)).join('') + '</div>' }) +
          UI.card({ title: 'قابلیت‌ها', hint: UI.fa(Object.keys(a.feat).length) + ' از ' + UI.fa(C.features.length), body: C.features.map(f => { const u = a.feat[f.key]; return '<div class="kv"><span class="k" style="color:' + (u ? 'var(--ink)' : 'var(--faint)') + '">' + UI.esc(f.label) + '</span><span class="v">' + (u ? '<span class="muted" style="font-weight:400">آخرین بار ' + UI.agoDays(u.last) + '</span>' : '<span class="faint" style="font-weight:400">استفاده نکرده</span>') + '</span></div>'; }).join('') }) +
        '</div></div>';
      const lab = [], vals = [];
      for (let d = 89; d >= 0; d--) { lab.push(UI.date(d)); vals.push(a.ev[d]); }
      Charts.columns(T.querySelector('#c-act'), { labels: lab, xEvery: 15, series: [{ name: 'ویرایش', values: vals }], height: 190 });
    }

    if (tab === 'activity') {
      T.innerHTML = '<div class="grid g2">' +
        UI.card({ title: 'ویرایش در روز', hint: '۱۲۰ روز', body: '<div id="c1"></div>' }) +
        UI.card({ title: 'کاربران فعال در روز', hint: '۱۲۰ روز · از ' + UI.fa(a.memberCount) + ' عضو', body: '<div id="c2"></div>' }) +
        '</div>' +
        UI.card({ title: 'هفته‌های فعال از روز ثبت‌نام', hint: UI.fa(a.wk.length) + ' هفته · ' + UI.pct(a.wk.reduce((s, x) => s + x, 0) / a.wk.length) + ' فعال', body: Charts.spark(Array.from(a.wk), { w: Math.min(1100, a.wk.length * 14), h: 34, bars: true }) + '<div class="note" style="margin-top:6px">هر ستون یک هفته است؛ ستون خاکستری یعنی آن هفته هیچ فعالیتی نبوده. ' + (a.decline ? 'افت از حدود ' + UI.agoDays(a.decline.start) + ' شروع شده است.' : '') + '</div>' });
      const lab = [], v1 = [], v2 = [];
      for (let d = 119; d >= 0; d--) { lab.push(UI.date(d)); v1.push(a.ev[d]); v2.push(a.au[d]); }
      Charts.columns(T.querySelector('#c1'), { labels: lab, xEvery: 20, series: [{ name: 'ویرایش', values: v1 }], height: 200 });
      Charts.columns(T.querySelector('#c2'), { labels: lab, xEvery: 20, series: [{ name: 'کاربر فعال', values: v2 }], height: 200 });
    }

    if (tab === 'members') {
      T.innerHTML = '<div class="card" id="tm"></div><div class="note">سقف پلن و صندلی‌های خریداری‌شده در کارت «اعضای فعال» بالای صفحه آمده است. شمارهٔ تماس اعضا فقط برای نقش‌های مجاز نمایش داده می‌شود.</div>';
      UI.table(T.querySelector('#tm'), {
        rows: a.members.map((m, i) => Object.assign({ id: i }, m)), pageSize: 25, unit: 'عضو', exportName: 'members-' + a.slug,
        sort: { key: 'lastSeen', dir: 'asc' },
        columns: [
          { key: 'name', label: 'عضو', render: m => '<span class="row"><span class="avatar">' + UI.esc(UI.initials(m.name)) + '</span><b>' + UI.esc(m.name) + '</b></span>' },
          { key: 'role', label: 'نقش', render: m => m.role === 'مالک' ? '<span class="badge st-info">' + UI.esc(m.role) + '</span>' : UI.esc(m.role) },
          { key: 'joined', label: 'عضو از', sort: m => -m.joined, render: m => UI.date(m.joined, { year: true }), csv: m => UI.date(m.joined, { year: true }) },
          { key: 'lastSeen', label: 'آخرین فعالیت', render: m => UI.esc(UI.agoDays(m.lastSeen)), csv: m => m.lastSeen },
          { key: 'active', label: 'این هفته', sort: m => m.lastSeen <= 6 ? 1 : 0, render: m => m.lastSeen <= 6 ? UI.statusBadge('good', 'فعال') : '<span class="faint">غیرفعال</span>', csv: m => m.lastSeen <= 6 ? 'فعال' : 'غیرفعال' },
        ],
      });
    }

    if (tab === 'bases') {
      T.innerHTML = '<div class="card" id="tb"></div>';
      UI.table(T.querySelector('#tb'), {
        rows: a.bases, unit: 'بیس', exportName: 'bases-' + a.slug, sort: { key: 'records', dir: 'desc' }, onRow: b => { location.href = 'base.html?id=' + b.id; },
        emptyTitle: 'هنوز بیسی نساخته', empty: 'این مشتری ثبت‌نام کرده ولی بیسی نساخته است — ایمیل تمپلیت‌های صنعت ' + a.industryName + ' را بفرستید.',
        columns: [
          { key: 'name', label: 'بیس', render: b => '<a class="nm" href="base.html?id=' + b.id + '">' + UI.esc(b.name) + '</a><span class="s mono">/' + UI.esc(b.slug) + '</span>' },
          { key: 'tables', label: 'جدول', num: true, render: b => UI.n(b.tables) },
          { key: 'records', label: 'رکورد', num: true, render: b => UI.n(b.records) },
          { key: 'automations', label: 'اتوماسیون', num: true, render: b => UI.n(b.automations) },
          { key: 'pages', label: 'صفحهٔ درگاه', num: true, render: b => UI.n(b.pages) },
          { key: 'collaborators', label: 'همکار', num: true, render: b => UI.n(b.collaborators) },
          { key: 'created', label: 'ساخته‌شده', sort: b => -b.created, render: b => UI.date(b.created, { year: true }) },
          { key: 'lastActive', label: 'آخرین فعالیت', sort: b => -b.lastActive, render: b => UI.esc(UI.agoDays(b.lastActive)) },
        ],
      });
    }

    if (tab === 'billing') {
      const pe = a.planEvents.map(e => '<div class="ev ' + (e.kind === 'churn' ? 'crit' : e.kind === 'contraction' ? 'warn' : 'good') + '"><div class="t">' + UI.date(e.t, { year: true }) + ' — ' + ({ new: 'اولین خرید', expansion: 'افزایش', contraction: 'کاهش', churn: 'لغو اشتراک' }[e.kind]) + '</div><div class="d">' + (e.kind === 'churn' ? UI.esc(a.churnReason || '') : 'پلن ' + C.plans[e.plan].name + ' · ' + UI.fa(e.seats) + ' صندلی · ' + C.cycles[e.cycle].name + ' · ' + UI.money(e.mrr) + ' در ماه') + '</div></div>').join('');
      T.innerHTML = '<div class="grid g-main"><div class="card" id="ti"></div><div class="stack">' +
        UI.card({ title: 'اشتراک', body: a.paying ? '<div class="kv"><span class="k">پلن</span><span class="v">' + UI.planBadge(a.plan) + '</span></div><div class="kv"><span class="k">دورهٔ پرداخت</span><span class="v">' + C.cycles[a.cycle].name + (C.cycles[a.cycle].discount ? ' (' + UI.pct(C.cycles[a.cycle].discount) + ' تخفیف)' : '') + '</span></div><div class="kv"><span class="k">صندلی</span><span class="v">' + UI.fa(a.seats) + '</span></div><div class="kv"><span class="k">درآمد ماهانه</span><span class="v">' + UI.money(a.mrr) + '</span></div><div class="kv"><span class="k">تمدید بعدی</span><span class="v">' + UI.date(-a.renewIn, { year: true }) + ' · ' + UI.inDays(a.renewIn) + '</span></div>' : '<div class="note">' + (a.everPaid ? 'این مشتری قبلاً پرداخت می‌کرد و اکنون روی پلن رایگان است.' : 'هنوز پرداختی نداشته است.') + '</div>' }) +
        UI.card({ title: 'تغییرات پلن', body: pe ? '<div class="tl">' + pe + '</div>' : '<div class="note">تغییری ثبت نشده.</div>' }) +
        '</div></div>';
      UI.table(T.querySelector('#ti'), {
        rows: a.invoices.map((v, i) => Object.assign({ id: i }, v)).reverse(), unit: 'فاکتور', exportName: 'invoices-' + a.slug, sort: { key: 't', dir: 'asc' },
        emptyTitle: 'فاکتوری نیست', empty: 'این مشتری هنوز خریدی نداشته است.',
        columns: [
          { key: 't', label: 'تاریخ', render: v => UI.date(v.t, { year: true }), csv: v => UI.date(v.t, { year: true }) },
          { key: 'plan', label: 'پلن', render: v => UI.planBadge(v.plan) },
          { key: 'amount', label: 'مبلغ (تومان)', num: true, render: v => UI.n(v.amount) },
          { key: 'status', label: 'وضعیت', render: v => v.status === 'paid' ? UI.statusBadge('good', 'پرداخت شد') : UI.statusBadge('crit', 'ناموفق · ' + UI.fa(v.retries) + ' تلاش'), csv: v => v.status },
        ],
      });
    }

    if (tab === 'log') {
      const rows = ns.map(x => ({ when: 'همین مرورگر', sortKey: -1, who: x.who, what: x.text, kind: x.kind === 'call' ? 'تماس' : 'یادداشت' }))
        .concat(interactions.slice().sort((p, q) => p.t - q.t || q.min - p.min).map(x => ({ when: UI.agoDays(x.t) + ' ' + UI.clock(x.min), sortKey: x.t, who: DB.rep(x.rep).name, what: (DB.OUTCOME_LABEL[x.outcome] || x.outcome) + (x.mrr ? ' · ' + UI.money(x.mrr) : '') + (x.reason ? ' · ' + x.reason : ''), kind: { call: 'تماس', email: 'ایمیل', meeting: 'جلسه', deal: 'قرارداد' }[x.type] })));
      T.innerHTML = UI.card({ title: 'تعامل‌ها', hint: 'تماس، ایمیل، جلسه و قرارداد', acts: '<button class="btn sm" id="nt2">' + UI.icon('note') + 'یادداشت</button><button class="btn sm primary" id="cl2">' + UI.icon('phone') + 'ثبت تماس</button>', flush: true,
        body: rows.length ? '<div class="list" style="padding:0 16px">' + rows.map(r => '<div class="li"><span class="tag">' + UI.esc(r.kind) + '</span><span class="main"><span class="t" style="font-weight:600">' + UI.esc(r.what) + '</span><span class="d">' + UI.esc(r.who) + '</span></span><span class="end faint">' + UI.esc(r.when) + '</span></div>').join('') + '</div>' : '<div class="empty"><b>هنوز تعاملی ثبت نشده</b>اولین تماس را ثبت کنید تا همکاران هم ببینند.</div>' });
      T.querySelector('#nt2').onclick = () => UI.addNoteForm(a, () => ctx.rerender());
      T.querySelector('#cl2').onclick = () => UI.logOutcome(a, null, () => ctx.rerender());
    }
  },
  wire(ctx) {
    document.getElementById('own').onchange = ev => { UI.setOwner([a.id], ev.target.value || null); UI.toast('مسئول تغییر کرد'); };
    document.getElementById('nt').onclick = () => UI.addNoteForm(a, () => ctx.rerender());
    document.getElementById('cl').onclick = () => UI.logOutcome(a, null, () => ctx.rerender());
  },
});

function timeline() {
  const m = a.milestones, ev = [];
  const at = d => a.age - d;                     // milestone offset → days ago
  const add = (t, cls, title, desc) => ev.push({ t, cls, title, desc });
  add(a.age, 'mut', 'اولین بازدید و ثبت‌نام', 'از ' + DB.source(a.source).name + ' · ' + a.contact.first + ' ' + a.contact.last);
  if (m.firstBase !== undefined) add(at(m.firstBase), '', 'اولین بیس', '«' + (a.bases[0] ? a.bases[0].name : '') + '» ' + (m.firstBase === 0 ? 'همان روز' : UI.fa(m.firstBase) + ' روز بعد از ثبت‌نام'));
  else add(Math.max(0, a.age - 2), 'warn', 'هنوز بیسی نساخته', 'این حساب از مرحلهٔ اول جلوتر نرفته است');
  if (m.activated !== undefined) add(at(m.activated), 'good', 'فعال‌سازی', 'به ' + UI.fa(C.activation.records) + ' رکورد رسید · روز ' + UI.fa(m.activated));
  if (m.team !== undefined) add(at(m.team), '', 'اولین همکار', UI.fa(a.invitesAccepted) + ' دعوت پذیرفته از ' + UI.fa(a.invitesSent));
  if (m.habit !== undefined) add(at(m.habit), 'good', 'عادت', 'در ۳ هفته از ۴ هفتهٔ اول فعال بود');
  if (a.feat.automation) add(a.feat.automation.first, '', 'اولین اتوماسیون', UI.fa(a.automations) + ' اتوماسیون فعال');
  if (m.pricing !== undefined && m.paid === undefined) add(at(m.pricing), '', 'بازدید صفحهٔ قیمت', 'هنوز خرید نکرده');
  a.planEvents.forEach(e => add(e.t, e.kind === 'churn' ? 'crit' : e.kind === 'contraction' ? 'warn' : 'good',
    { new: 'اولین پرداخت', expansion: 'ارتقا', contraction: 'کاهش پلن', churn: 'لغو اشتراک' }[e.kind],
    e.kind === 'churn' ? a.churnReason : 'پلن ' + C.plans[e.plan].name + ' · ' + UI.money(e.mrr) + ' در ماه'));
  if (a.decline) add(a.decline.start, 'warn', 'شروع افت فعالیت', 'فعالیت از این هفته پیوسته کم شده است');
  if (a.pastDue) add(a.invoices[a.invoices.length - 1].t, 'crit', 'پرداخت تمدید ناموفق', UI.fa(a.invoices[a.invoices.length - 1].retries) + ' تلاش ناموفق');
  add(0, a.online ? 'good' : 'mut', 'امروز', a.online ? 'هم‌اکنون آنلاین است' : 'آخرین فعالیت ' + UI.ago(a.lastSeenMin));
  return ev.sort((p, q) => q.t - p.t).map(e => '<div class="ev ' + e.cls + '"><div class="t">' + UI.esc(e.title) + ' <span class="w">' + UI.date(e.t, { year: true }) + '</span></div><div class="d">' + UI.esc(e.desc) + '</div></div>').join('');
}
})();
</script>
</body>
</html>
