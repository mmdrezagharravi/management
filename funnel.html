<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قیف تبدیل — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { agg, accounts, CONFIG: C } = DB;
const MATURE = 30;                                         // cohort starts 30 days back so every account had time to move
const curSrc = () => { const s = UI.param('src'); return s && DB.source(s) ? s : null; };
const rate = (x, y) => y ? x / y : 0;
const days = d => d == null ? '—' : UI.fa(d) + ' روز';

// what to do when a step is the weakest — copy only; numbers are interpolated
const PLAY = {
  firstBase: { what: 'ثبت‌نام کرده‌اند ولی هیچ بیسی نساخته‌اند',
    todo: 'در اولین ورود قالبِ هم‌صنف را پیشنهاد دهید و برای حساب‌های بی‌بیس ایمیل «اولین بیس در ۵ دقیقه» بفرستید.',
    href: 'onboarding.html', cta: 'حساب‌های بی‌بیس' },
  activated: { what: 'بیس ساخته‌اند ولی در هفتهٔ اول به ' + UI.fa(C.activation.records) + ' رکورد نرسیده‌اند',
    todo: 'ورود از Excel را در صفحهٔ اول بیس پیشنهاد دهید و روز سوم با این حساب‌ها تماس کوتاه بگیرید.',
    href: 'onboarding.html', cta: 'حساب‌های فعال‌نشده' },
  habit: { what: 'فعال شده‌اند ولی در هفته‌های دوم تا چهارم برنگشته‌اند',
    todo: 'در هفتهٔ اول یک اتوماسیون یا یادآور برایشان بسازید تا دلیلی برای برگشتن داشته باشند.',
    href: 'onboarding.html', cta: 'ثبت‌نام‌های تازه' },
  paid: { what: 'به عادت رسیده‌اند ولی هنوز پرداخت نکرده‌اند',
    todo: 'این‌ها گرم‌ترین سرنخ‌ها هستند: به‌محض برخورد با سقف پلن، پیشنهاد ارتقا بدهید.',
    href: 'customers.html?view=upsell', cta: 'سرنخ‌های آمادهٔ ارتقا' },
};

UI.page({
  id: 'funnel', title: 'قیف تبدیل', range: true, sources: ['clarity', 'main', 'behavior'],
  get sub() {
    const R = UI.range();
    return 'کوهورت بالغ: حساب‌هایی که ' + UI.fa(MATURE) + ' تا ' + UI.fa(MATURE + R) + ' روز پیش ثبت‌نام کرده‌اند (' + UI.date(MATURE + R - 1) + ' تا ' + UI.date(MATURE) + ') — همه دست‌کم یک ماه فرصت داشته‌اند به هر پله برسند';
  },
  actions: () => {
    const s = curSrc();
    return '<select class="select" id="src" aria-label="منبع جذب"><option value="">همهٔ منابع</option>' +
      C.sources.map(x => '<option value="' + x.key + '"' + (x.key === s ? ' selected' : '') + '>' + UI.esc(x.name) + '</option>').join('') + '</select>';
  },
  render(ctx) {
    const R = ctx.range, B = ctx.body, src = curSrc();
    const setSrc = v => { UI.setParam('src', v || null); ctx.rerender(); };
    ctx.el.querySelector('#src').onchange = ev => setSrc(ev.target.value);

    const f = agg.funnel(MATURE, R, src || undefined), fp = agg.funnel(MATURE + R, R, src || undefined);
    const K = {}, KP = {}; f.forEach(s => { K[s.key] = s; }); fp.forEach(s => { KP[s.key] = s; });
    const V = K.visit, S = K.signup, A = K.activated, P = K.paid;
    const srcName = src ? DB.source(src).name : null;

    // ---------------------------------------------------------------- KPIs
    const prevCmp = v => 'کوهورت قبلی: ' + v;
    let h = (src ? '<div class="banner info">' + UI.icon('filter') + '<div>فقط ثبت‌نام‌های منبع <b>' + UI.esc(srcName) + '</b> — <a href="#" id="clr">نمایش همهٔ منابع</a></div></div>' : '') +
      '<div class="kpis">' +
      UI.kpi({ label: 'بازدید سایت', value: UI.n(V.n), info: UI.fa(V.def), href: 'acquisition.html', delta: UI.delta(V.n, KP.visit.n), cmp: prevCmp(UI.n(KP.visit.n)) }) +
      UI.kpi({ label: 'ثبت‌نام', value: UI.n(S.n), info: S.def, href: 'onboarding.html', delta: UI.delta(S.n, KP.signup.n), cmp: prevCmp(UI.n(KP.signup.n)) }) +
      UI.kpi({ label: 'نرخ ثبت‌نام', value: UI.pct(rate(S.n, V.n), 1), info: 'ثبت‌نام ÷ بازدید سایت',
        delta: UI.delta(rate(S.n, V.n), rate(KP.signup.n, KP.visit.n), { points: true }), cmp: prevCmp(UI.pct(rate(KP.signup.n, KP.visit.n), 1)) }) +
      UI.kpi({ label: 'نرخ فعال‌سازی', value: UI.pct(A.fromStart), info: UI.fa(A.def) + ' — سهم از ثبت‌نام‌ها',
        delta: UI.delta(A.fromStart, KP.activated.fromStart, { points: true }), cmp: prevCmp(UI.pct(KP.activated.fromStart)) }) +
      UI.kpi({ label: 'نرخ پرداخت', value: UI.pct(P.fromStart, 1), info: 'پرداخت‌کننده ÷ ثبت‌نام. کوهورت قبلی زمان بیشتری برای پرداخت داشته، پس مقایسهٔ مستقیم منصفانه نیست',
        cmp: 'کوهورت قبلی (بالغ‌تر): ' + UI.pct(KP.paid.fromStart, 1) }) +
      UI.kpi({ label: 'زمان میانه تا فعال‌سازی', value: A.medianDays == null ? '—' : UI.fa(A.medianDays), unit: 'روز', info: 'روز پس از ثبت‌نام، میانهٔ حساب‌هایی که به پله رسیده‌اند',
        cmp: 'تا پرداخت: <b style="color:var(--ink)">' + days(P.medianDays) + '</b>' }) +
      '</div>';

    // --------------------------------------------------------------- funnel
    const steps = f.slice(1);                       // signup → paid; visits sit in the header line (different scale)
    let worst = null;
    steps.forEach((s, i) => { if (i && steps[i - 1].n && (!worst || s.fromPrev < worst.fromPrev)) worst = s; });
    const bar = s => {
      const w = S.n ? s.n / S.n * 100 : 0, out = w < 16;
      return '<div class="b"><i style="width:' + w.toFixed(1) + '%"></i><span' + (out ? ' class="out" style="right:calc(' + w.toFixed(1) + '% + 8px)"' : '') + '>' + UI.n(s.n) + '</span></div>';
    };
    let fn = '<div class="row wrap" style="gap:4px 12px;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;margin-bottom:8px">' +
      '<span><b>' + UI.n(V.n) + '</b> بازدید سایت</span><span class="muted">←</span><span><b>' + UI.n(S.n) + '</b> ثبت‌نام</span>' +
      '<span class="muted">نرخ ثبت‌نام <b style="color:var(--ink)">' + UI.pct(rate(S.n, V.n), 1) + '</b> · ' + UI.n(V.n - S.n) + ' بازدیدکننده حساب نساختند</span></div><div class="fn">';
    steps.forEach((s, i) => {
      if (i) {
        const lost = steps[i - 1].n - s.n;
        fn += '<div class="drop"><span></span><span>' + (s === worst ? '<span class="badge st-crit" style="height:19px;margin-left:6px"><i class="dot"></i>بزرگ‌ترین ریزش</span>' : '') +
          '− ' + UI.n(lost) + ' حساب (' + UI.pct(1 - s.fromPrev) + ') به این پله نرسیدند</span><span></span></div>';
      }
      const right = i === 0 ? 'پایهٔ درصدها<br>از بازدید <b>' + UI.pct(rate(S.n, V.n), 1) + '</b>'
        : 'از قبلی <b>' + UI.pct(s.fromPrev) + '</b> · از ثبت‌نام <b>' + UI.pct(s.fromStart, s.fromStart < 0.1 ? 1 : 0) + '</b>' + (s.medianDays != null ? '<br>میانه <b>' + days(s.medianDays) + '</b> پس از ثبت‌نام' : '');
      fn += '<div class="st"><div class="l">' + UI.esc(s.label) + '<small>' + UI.fa(UI.esc(s.def)) + '</small></div>' + bar(s) + '<div class="r">' + right + '</div></div>';
    });
    fn += '</div>';

    // ---------------------------------------------------- biggest drop callout
    let call = '';
    if (worst) {
      const prev = steps[steps.indexOf(worst) - 1], p = PLAY[worst.key];
      call = UI.card({ title: 'بزرگ‌ترین ریزش پس از ثبت‌نام', acts: '<span class="badge st-crit"><i class="dot"></i>' + UI.pct(1 - worst.fromPrev) + ' ریزش</span>',
        body: '<div class="prose"><b>«' + UI.esc(prev.label) + '» ← «' + UI.esc(worst.label) + '»:</b> ' + UI.n(prev.n - worst.n) + ' حساب از ' + UI.n(prev.n) + ' ' + p.what + '.<br>' + p.todo + '</div>',
        foot: '<a href="onboarding.html">ثبت‌نام‌های تازه</a>' + (p.href !== 'onboarding.html' ? '<a href="' + p.href + '">' + p.cta + '</a>' : '') });
    }

    // ------------------------------------------------------- stuck right now
    const pool = accounts.filter(a => a.age >= 3 && a.age <= 14 && (!src || a.source === src));
    const noBase = pool.filter(a => a.milestones.firstBase === undefined).length;
    const notAct = pool.filter(a => a.milestones.firstBase !== undefined && a.milestones.activated === undefined).length;
    const big = (n, t, d) => '<a class="li" href="onboarding.html"><span class="hero" style="font-size:26px;min-width:48px">' + UI.n(n) + '</span><span class="main"><span class="t">' + t + '</span><span class="d">' + d + '</span></span>' + UI.icon('chevronL', 'faint') + '</a>';
    const stuck = UI.card({ title: 'گیرکرده، همین حالا', hint: 'ثبت‌نام ۳ تا ۱۴ روز پیش' + (src ? ' · ' + UI.esc(srcName) : ''), flush: true,
      body: '<div class="list" style="padding:0 16px">' +
        big(noBase, 'هنوز بیسی نساخته‌اند', 'ایمیل راهنمای ساخت اولین بیس بفرستید') +
        big(notAct, 'بیس دارند، فعال نشده‌اند', 'تماس کوتاه برای ورود داده از Excel') + '</div>',
      foot: '<span>از ' + UI.n(pool.length) + ' ثبت‌نام این دو هفته</span><a href="onboarding.html">پیگیری در «ثبت‌نام‌های تازه»</a>' });

    // ---------------------------------------------------------- by source
    const rows = C.sources.map(s => {
      const o = {}; agg.funnel(MATURE, R, s.key).forEach(x => { o[x.key] = x; });
      return { s, visits: o.visit.n, signups: o.signup.n, sr: rate(o.signup.n, o.visit.n), fb: o.firstBase.fromStart, act: o.activated.fromStart, habit: o.habit.fromStart, paid: o.paid.fromStart };
    });
    const tot = (() => { const o = {}; agg.funnel(MATURE, R).forEach(x => { o[x.key] = x; }); return { visits: o.visit.n, signups: o.signup.n, sr: rate(o.signup.n, o.visit.n), fb: o.firstBase.fromStart, act: o.activated.fromStart, habit: o.habit.fromStart, paid: o.paid.fromStart }; })();
    const cols = [['visits', 'بازدید', UI.n], ['signups', 'ثبت‌نام', UI.n], ['sr', 'نرخ ثبت‌نام', v => UI.pct(v, 1)], ['fb', 'اولین بیس', v => UI.pct(v)], ['act', 'فعال‌سازی', v => UI.pct(v)], ['habit', 'عادت', v => UI.pct(v)], ['paid', 'پرداخت', v => UI.pct(v, 1)]];
    const best = {}; cols.forEach(([k]) => { best[k] = Math.max(...rows.map(r => r[k])); });
    const srcTbl = '<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>منبع</th>' + cols.map(c => '<th class="num">' + c[1] + '</th>').join('') + '</tr></thead><tbody>' +
      rows.map(r => '<tr class="click' + (r.s.key === src ? ' sel' : '') + '" data-src="' + r.s.key + '" title="نمایش قیف فقط برای این منبع"><td class="nowrap"><b>' + UI.esc(r.s.name) + '</b></td>' +
        cols.map(([k, , fm]) => '<td class="num">' + (r[k] === best[k] && r[k] > 0 ? '<b style="color:var(--ink)">' + fm(r[k]) + '</b>' : '<span class="muted">' + fm(r[k]) + '</span>') + '</td>').join('') + '</tr>').join('') +
      '<tr style="background:var(--surface-2)"><td><b>همه</b></td>' + cols.map(([k, , fm]) => '<td class="num"><b>' + fm(tot[k]) + '</b></td>').join('') + '</tr>' +
      '</tbody></table></div>';

    // ------------------------------------------------------------- layout
    h += '<div class="grid g-main">' +
      UI.card({ title: 'قیف' + (src ? ' · ' + UI.esc(srcName) : ''), hint: 'پهنای هر میله = سهم از ثبت‌نام‌های کوهورت', body: fn,
        foot: '<span>هر حساب فقط یک بار شمرده می‌شود؛ «پرداخت» یعنی پس از رسیدن به عادت</span><a href="journey.html">نقشهٔ مسیر مشتری</a>' }) +
      '<div class="stack">' + call + stuck + '</div></div>';
    h += '<div class="grid g-main">' +
      UI.card({ title: 'قیف به تفکیک منبع', hint: 'درصدها از ثبت‌نام · پررنگ = بهترین در ستون', flush: true, body: srcTbl,
        foot: '<span>روی یک منبع بزنید تا کل صفحه برای همان منبع حساب شود</span><a href="acquisition.html">هزینه و CAC منابع</a>' }) +
      UI.card({ title: 'نرخ فعال‌سازی هفتگی', hint: '۱۶ هفتهٔ اخیر ثبت‌نام' + (src ? ' · ' + UI.esc(srcName) : ''), body: '<div id="c-act"></div>',
        foot: '<span>هر نقطه = ثبت‌نام‌های یک هفتهٔ کامل و بالغ</span><a href="onboarding.html">ثبت‌نام‌های تازه</a>' }) +
      '</div>';
    B.innerHTML = h;

    const clr = B.querySelector('#clr'); if (clr) clr.onclick = ev => { ev.preventDefault(); setSrc(null); };
    B.querySelectorAll('tr[data-src]').forEach(tr => tr.onclick = () => setSrc(tr.dataset.src === src ? null : tr.dataset.src));

    // weekly activation trend: signup weeks that ended ≥ 7 days ago
    const labels = [], tips = [], vals = [];
    for (let w = 15; w >= 0; w--) {
      const from = 7 + 7 * w;
      let n = 0, x = 0;
      for (const a of accounts) if (a.age >= from && a.age < from + 7 && (!src || a.source === src)) { n++; if (a.milestones.activated !== undefined) x++; }
      labels.push(UI.date(from + 6)); tips.push('ثبت‌نام ' + UI.date(from + 6) + ' تا ' + UI.date(from) + ' · ' + UI.n(n) + ' حساب');
      vals.push(n ? x / n : null);
    }
    Charts.line(B.querySelector('#c-act'), { labels, tipLabels: tips, series: [{ name: 'نرخ فعال‌سازی', values: vals }], height: 230, yFormat: v => UI.pct(v), xTicks: 4 });
  },
});
})();
</script>
</body>
</html>
