<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منابع جذب — پنل Airsheet</title>
<link rel="stylesheet" href="shell.css">
<style>#t-src table.tbl { min-width: 860px; }</style>
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
const { agg, accounts, CONFIG: C } = DB;
const M_FROM = 30, M_LEN = 90;                  // mature cohort: signed up 30–120 days ago
const sum = (arr, k) => arr.reduce((t, x) => t + x[k], 0);
const txt = s => '<span style="font-size:19px">' + UI.esc(s) + '</span>';

UI.page({
  id: 'acquisition', title: 'منابع جذب', range: true, sources: ['clarity', 'main'],
  sub: 'کدام کانال مشتری پرداخت‌کننده می‌آورد، نه فقط ثبت‌نام',
  render(ctx) {
    const R = ctx.range, B = ctx.body;
    const cur = agg.sources(0, R), mat = agg.sources(M_FROM, M_LEN);
    const vis = agg.visits(0, R), visP = agg.visits(R, R), su = agg.signups(0, R), suP = agg.signups(R, R);
    const spend = sum(C.sources, 'spend') * R / 30;
    const mSpend = sum(mat, 'spend'), mPaid = sum(mat, 'paid'), mSu = sum(mat, 'signups');
    const cac = mPaid ? mSpend / mPaid : null;
    const avgPaid = mSu ? mPaid / mSu : 0;
    const solid = mat.filter(s => s.signups >= 30);           // ignore tiny samples when naming a winner
    const best = (solid.length ? solid : mat).slice().sort((p, q) => q.paidRate - p.paidRate)[0];
    const paidCh = mat.filter(s => s.spend > 0);
    const cacOf = s => s.paid ? s.spend / s.paid : Infinity;
    const worst = paidCh.slice().sort((p, q) => cacOf(q) - cacOf(p))[0];
    const bestPaid = paidCh.slice().sort((p, q) => cacOf(p) - cacOf(q))[0];
    const paidNames = C.sources.filter(s => s.spend).map(s => s.name).join('، ');

    // ---------------------------------------------------------------- KPIs
    let h = '<div class="kpis">' +
      UI.kpi({ label: 'بازدید سایت', value: UI.n(vis), delta: UI.delta(vis, visP), cmp: 'قبل: ' + UI.n(visP), info: 'بازدیدکنندهٔ یکتا در ' + UI.fa(R) + ' روز' }) +
      UI.kpi({ label: 'ثبت‌نام', value: UI.n(su), href: 'onboarding.html', delta: UI.delta(su, suP), cmp: 'قبل: ' + UI.n(suP) }) +
      UI.kpi({ label: 'نرخ ثبت‌نام', value: UI.pct(vis ? su / vis : 0, 1), info: 'ثبت‌نام ÷ بازدید', delta: UI.delta(vis ? su / vis : 0, visP ? suP / visP : 0, { points: true }), cmp: 'قبل: ' + UI.pct(visP ? suP / visP : 0, 1) }) +
      UI.kpi({ label: 'هزینهٔ جذب در ' + UI.fa(R) + ' روز', value: UI.compactParts(spend).num, unit: UI.compactParts(spend).unit + ' ' + C.currency, info: 'بودجهٔ ماهانهٔ کانال‌های پولی به نسبت بازه', cmp: paidNames }) +
      UI.kpi({ label: 'هزینهٔ جذب هر مشتری', value: cac == null ? '—' : UI.compactParts(cac).num, unit: cac == null ? '' : UI.compactParts(cac).unit + ' ' + C.currency,
        info: 'CAC ترکیبی: کل هزینهٔ ۹۰ روز ÷ همهٔ پرداخت‌کنندگانِ کوهورت بالغ (ثبت‌نام ۳۰ تا ۱۲۰ روز پیش)، از هر منبع', cmp: UI.n(mPaid) + ' پرداخت‌کننده از ' + UI.n(mSu) + ' ثبت‌نام' }) +
      UI.kpi({ label: 'بهترین کانال (نرخ پرداخت)', value: txt(best.name), cmp: '<b style="color:var(--ink)">' + UI.pct(best.paidRate, 1) + '</b> در برابر میانگین ' + UI.pct(avgPaid, 1) }) +
      '</div>';

    // ------------------------------------------------------- recommendation
    const ratio = avgPaid ? best.paidRate / avgPaid : 0;
    const payback = s => { const arpa = s.paid ? s.mrr / s.paid : 0; return arpa && s.paid ? cacOf(s) / arpa : null; };
    let rec = '<b>روی «' + UI.esc(best.name) + '» بیشتر سرمایه بگذارید:</b> ' + UI.pct(best.paidRate, 1) + ' از ثبت‌نام‌هایش پرداخت‌کننده شده‌اند، ' + UI.n(ratio, 1) + ' برابر میانگین' +
      (best.spend ? ' و CAC آن ' + UI.money(cacOf(best)) + ' است.' : '، بدون هیچ هزینهٔ تبلیغاتی.') +
      ' ' + ({
        invite: 'دکمهٔ «دعوت همکار» را بعد از ساخت اولین بیس نشان دهید و برای دعوت‌کننده پاداش بگذارید.',
        direct: 'این‌ها Airsheet را از قبل می‌شناسند؛ برنامهٔ معرفی و نمونه‌های موفق مشتریان را تقویت کنید تا این گروه بزرگ‌تر شود.',
        google: 'برای جست‌وجوهای بیشتر، صفحهٔ قالب و محتوای آموزشی صنف‌به‌صنف بسازید.',
      }[best.key] || (best.spend ? 'بودجهٔ این کانال را بالا ببرید.' : 'سهم این کانال از محتوا و پیگیری را بالا ببرید.'));
    if (worst && worst !== bestPaid) {
      const pb = payback(worst);
      rec += '<br><b>«' + UI.esc(worst.name) + '» گران‌ترین کانال پولی است:</b> ' + (worst.paid ? 'هر مشتری پرداخت‌کننده ' + UI.money(cacOf(worst)) + ' خرج برداشته' + (pb ? ' و ' + UI.n(pb, 0) + ' ماه طول می‌کشد تا برگردد' : '') : 'در کوهورت بالغ هیچ مشتری پرداخت‌کننده‌ای نیاورده') +
        '؛ در برابر «' + UI.esc(bestPaid.name) + '» با CAC ' + UI.money(cacOf(bestPaid)) + '. بودجه‌اش را کم کنید یا هدف‌گیری و صفحهٔ فرود را بازبینی کنید.';
    }
    h += UI.card({ cls: 'tint-accent', title: UI.icon('target') + 'پیشنهاد این هفته', body: '<div class="prose">' + rec + '</div>',
      foot: '<span>بر پایهٔ کوهورت بالغ ۹۰ روزه · ' + UI.n(mSu) + ' ثبت‌نام</span><a href="funnel.html">قیف هر منبع</a>' });

    // ------------------------------------------------------------ table
    h += UI.card({ title: 'کانال‌ها', hint: 'بازدید و ثبت‌نام: ' + UI.fa(R) + ' روز اخیر', flush: true, body: '<div id="t-src"></div>',
      foot: '<span>✱ کوهورت بالغ: ثبت‌نام‌های ۳۰ تا ۱۲۰ روز پیش؛ پرداخت و MRR به منبعِ ثبت‌نام نسبت داده می‌شود</span><span>روی ردیف بزنید: مشتریان همان منبع</span>' });

    // ------------------------------------------------------- weekly by source
    h += UI.card({ title: 'ثبت‌نام هفتگی به تفکیک منبع', hint: '۱۲ هفتهٔ اخیر', body: '<div id="c-wk"></div><div class="legend" id="lg-wk" style="margin-top:8px"></div>',
        foot: '<span>ستون آخر = هفتهٔ جاری تا امروز</span><a href="onboarding.html">ثبت‌نام‌های تازه</a>' }) +
      '<div class="grid g2">' +
        UI.card({ title: 'کیفیت: نرخ فعال‌سازی هر منبع', hint: 'کوهورت بالغ', body: '<div id="c-act"></div>', foot: '<span>عدد کنار هر میله = حجم ثبت‌نام</span><a href="funnel.html">قیف تبدیل</a>' }) +
        UI.card({ title: 'ارزش: نرخ پرداخت هر منبع', hint: 'کوهورت بالغ', body: '<div id="c-paid"></div>', foot: '<span>روی هر منبع بزنید تا قیفش را ببینید</span><a href="retention.html">نگهداشت</a>' }) +
      '</div>';
    B.innerHTML = h;

    // table
    const rows = C.sources.map((s, i) => ({ id: i, key: s.key, name: s.name, paidCh: !!s.spend, visits: cur[i].visits, signups: cur[i].signups, sr: cur[i].signupRate,
      act: mat[i].activationRate, paid: mat[i].paid, pr: mat[i].paidRate, mrr: mat[i].mrr, spend: mat[i].spend, cac: mat[i].cac, mSu: mat[i].signups }));
    const bestOf = k => Math.max(...rows.map(r => r[k]));
    const hl = (r, k, s) => r[k] === bestOf(k) && r[k] > 0 ? '<b>' + s + '</b>' : s;
    UI.table(B.querySelector('#t-src'), {
      rows, exportName: 'acquisition', unit: 'کانال', pageSizes: false, compact: true, sort: { key: 'signups', dir: 'desc' },
      onRow: r => { location.href = 'customers.html?view=all&source=' + r.key; },
      columns: [
        { key: 'name', label: 'منبع', render: r => '<span class="nm">' + UI.esc(r.name) + '</span><span class="s">' + (r.paidCh ? 'پولی' : 'رایگان') + '</span>', csv: r => r.name },
        { key: 'visits', label: 'بازدید', num: true, render: r => UI.n(r.visits) },
        { key: 'signups', label: 'ثبت‌نام', num: true, render: r => hl(r, 'signups', UI.n(r.signups)) },
        { key: 'sr', label: 'نرخ ثبت‌نام', num: true, render: r => hl(r, 'sr', UI.pct(r.sr, 1)), csv: r => (r.sr * 100).toFixed(1) },
        { key: 'act', label: 'فعال‌سازی ✱', num: true, render: r => hl(r, 'act', UI.pct(r.act)), csv: r => (r.act * 100).toFixed(1) },
        { key: 'paid', label: 'پرداخت‌کننده ✱', num: true, render: r => UI.n(r.paid) + '<span class="faint"> / ' + UI.n(r.mSu) + '</span>', csv: r => r.paid },
        { key: 'pr', label: 'نرخ پرداخت ✱', num: true, render: r => hl(r, 'pr', UI.pct(r.pr, 1)), csv: r => (r.pr * 100).toFixed(1) },
        { key: 'mrr', label: 'MRR امروز ✱', num: true, render: r => hl(r, 'mrr', UI.compact(r.mrr)) },
        { key: 'spend', label: 'هزینه ۹۰ روز ✱', num: true, render: r => r.spend ? UI.compact(r.spend) : '<span class="faint">—</span>' },
        { key: 'cac', label: 'CAC ✱', num: true, sort: r => r.cac == null ? -1 : r.cac, render: r => r.cac == null ? '<span class="faint">—</span>' : UI.compact(r.cac), csv: r => r.cac == null ? '' : Math.round(r.cac) },
      ],
    });

    // weekly stacked columns: top 4 sources by 12-week volume keep their own color, the rest fold into one muted series
    const W = 12, cnt = {};
    C.sources.forEach(s => { cnt[s.key] = new Array(W).fill(0); });
    for (const a of accounts) if (a.age < W * 7) cnt[a.source][W - 1 - Math.floor(a.age / 7)]++;
    const ranked = C.sources.slice().sort((p, q) => cnt[q.key].reduce((t, v) => t + v, 0) - cnt[p.key].reduce((t, v) => t + v, 0));
    const top = ranked.slice(0, 4), rest = ranked.slice(4);
    const series = top.map((s, i) => ({ name: s.name, values: cnt[s.key], color: 'var(--series-' + (i + 1) + ')' }));
    series.push({ name: 'سایر منابع', values: cnt[top[0].key].map((_, i) => rest.reduce((t, s) => t + cnt[s.key][i], 0)), color: 'var(--deemph)' });
    const wl = []; for (let w = W - 1; w >= 0; w--) wl.push(UI.date(w * 7 + 6));
    Charts.columns(B.querySelector('#c-wk'), { labels: wl, tipLabels: wl.map((l, i) => 'هفتهٔ ' + l + (i === W - 1 ? ' (تا امروز)' : '')), series, total: 'ثبت‌نام', height: 240 });
    B.querySelector('#lg-wk').innerHTML = series.map(s => '<span class="k"><i class="sw" style="background:' + s.color + '"></i>' + UI.esc(s.name) + '</span>').join('') +
      '<span class="k faint">(' + UI.esc(rest.map(s => s.name).join('، ')) + ')</span>';

    const bars = (el, k) => Charts.hbars(B.querySelector(el), { labelWidth: 110, format: v => UI.pct(v, k === 'paidRate' ? 1 : 0),
      items: mat.slice().sort((p, q) => q[k] - p[k]).map(s => ({ label: s.name, value: s[k], note: UI.n(s.signups) + ' ثبت‌نام', href: 'funnel.html?src=' + s.key })) });
    bars('#c-act', 'activationRate');
    bars('#c-paid', 'paidRate');
  },
});
})();
</script>
</body>
</html>
